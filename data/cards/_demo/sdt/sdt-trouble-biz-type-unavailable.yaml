card_id: sdt-trouble-biz-type-unavailable
type: trouble
title: 下单选项配好了，批量下单还提示「业务类型不可用」？
one_liner: 两处对不上：一是下单类型配的业务类型与表格模板不一致，二是个性化顾客编码固定了产品类型。
body: |
  【现象】下单选项里明明配好了，批量下单还是报「业务类型不可用」。

  【排查顺序】

  ① 先比对下单类型与模板
     检查下单类型中配置的业务类型，和 Excel 模板里的类型是否完全一致。
     例如模板里写「特快」，配置里是「标快」，就会报错。

  ② 再查顾客编码
     如果确认配置没问题，检查是不是用了「个性化顾客编码」。
     这类编码可能固定绑定了产品业务类型（比如「商务标快」），
     导致模板里的其他类型用不了。

  【结论】①改模板或改配置，让两边一致；②换用支持该类型的顾客编码。
