title: 批量导入提示「联系人、联系方式、地址等错误」怎么办？
one_liner: 多半是表格里有系统认不出的字符，或内容格式不对。逐行核对表格对应内容后重导。
body: |
  【现象】批量新增导入时，系统报「联系人、联系方式、地址等错误」。

  【原因】一般有两种：
  · 填写的内容与系统要求的格式不一致
  · 单元格里带了不可识别的特殊字符（全角空格、不可见字符、特殊符号等）

  【处理步骤】
  1. 打开系统提示有问题的行
  2. 逐项核对联系人姓名、手机号、地址的格式
  3. 把地址里的特殊符号、多余空格删掉，保持纯文本
  4. 重新导入

  【小技巧】把单元格内容先粘贴到记事本，再从记事本粘回表格，可去掉隐藏字符。
