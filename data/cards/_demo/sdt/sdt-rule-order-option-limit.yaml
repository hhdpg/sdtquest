card_id: sdt-rule-order-option-limit
type: rule
title: 下单规则怎么配？一个组织能有几个下单规则？
one_liner: 只有一级组织管理员能配；规则数量不限，但每个组织只能使用一条下单规则。
body: |
  【配置入口】业务配置 → 下单选项 → 添加下单规则

  【怎么加】
  1. 点【添加下单规则】
  2. 在弹窗中选择【下单场景】
  3. 设置【规则名称】
  4. 点【确定】

  【系统预置】系统已自带一条默认下单规则，可直接用或在此基础上加。

  【关键限制】
  · **仅一级组织管理员**可设置下单规则
  · 下单规则本身**没有数量上限**
  · 但**每个组织只能使用一条下单规则**

  【下单场景说明】
  · 快递下单：下顺丰大网的运单，配置的是大网下单要填的字段
  · 同城急送下单：下同城急送的运单（需先开通同城急送服务）
