card_id: sdt-task-add-org
type: task
title: 怎么新增组织？能删除组织吗？
one_liner: 系统管理 → 组织管理 → 新增组织或批量导入；组织只能禁用不能删除，禁用后账号也登不上。
body: |
  【入口】系统管理 → 组织管理

  【新增单个】
  点【新增组织】，填写组织信息后保存。

  【批量新增】
  1. 点【组织批量导入】
  2. 点【下载导入模板】，按表格要求填写组织信息
  3. 点【上传文件】完成导入

  【查询与导出】
  输入查询条件点【查询】，点【导出】可导出查询到的组织。

  【批量修改】
  · 改单个：点【编辑】
  · 批量改：点【信息批量更新】→ 下载模板 → 填要改的字段 → 上传
  · 挪位置：勾选组织 →【批量移动组织】→ 选目标组织 → 确认

  【重要限制】
  · 组织**只能禁用，不能删除**
  · 禁用后可以再启用，但**禁用期间该组织的账号密码无法登录**
  · 一级组织不支持开通同城急送，只有子组织支持
