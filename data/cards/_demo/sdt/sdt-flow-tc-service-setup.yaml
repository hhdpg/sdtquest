card_id: sdt-flow-tc-service-setup
type: flow
title: 同城急送服务开通的完整流程是怎样的？
one_liner: 邮件申请开通 → 配店铺ID → 配下单规则 → 客户下单。四步走完才能用。
body: |
  【四步流程】
  1. **发邮件申请**
     让销售发到顺店通项目组，主题「XX（客户名称）申请开通顺店通系统的同城急送服务」。
     正文写明：客户名称、月单量、业务场景、开通原因、同城侧业务类型、顺店通一级组织编码。
     抄送区总、销售负责人、科技售前。
  2. **配置店铺 ID**
     入口：业务配置 → 同城急送服务
  3. **配置下单规则**
     入口：业务配置 → 下单选项 → 添加下单规则 → 同城急送下单
  4. **客户下单**
     微信搜【顺店通】小程序

  【关键前置】
  · 一级组织不支持，**只有子组织能开通**
  · 全程用客户一级组织管理员账号操作
  · 系统地址：https://united-store-ms.sf-express.com

  【各步细节见对应卡】店铺ID配置、下单规则配置、配置完成判断。
