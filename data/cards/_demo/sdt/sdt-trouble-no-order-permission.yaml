card_id: sdt-trouble-no-order-permission
type: trouble
title: 顺店通下不了单，显示没有权限怎么办？
one_liner: 是下单权限没配。找管理员到「系统管理 → 角色管理 → 配置权限」勾上对应业务权限。
body: |
  【现象】点「下单」提示没有权限，或按钮点不动。

  【原因】当前角色没有被授予下单相关的业务配置权限。

  【处理步骤】
  1. 找商户管理员登录 PC 后台
  2. 进入【系统管理】→【角色管理】→【配置权限】
  3. 找到你所属角色，勾选对应的业务配置权限
  4. 保存后让你重新登录，权限生效

  【注意】权限是按角色配的，改角色会影响该角色下所有人。
  只想给单个人开权限，建议单独建个角色再分配。
