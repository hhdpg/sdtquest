card_id: sdt-glossary-tc-cost-type
type: glossary
title: 同城急送的几个「成本类型」分别是什么意思？
one_liner: 消费者可自由填收寄件人；退货只回门店仓；门店调拨和组织间寄递只能用组织里维护的地址。
body: |
  【消费者】
  用于门店发给消费者（或客户）。
  收件人、寄件人信息可以自由填写，不受组织地址限制。

  【退货】
  仅用于逆向退货，回到门店或仓库。
  收件地址必须是登录账号所属组织里维护的地址。

  【门店调拨】
  用于门店之间调拨。
  收件人、寄件人信息都取自组织里维护的地址。

  【其他成本类型】
  仅支持组织之间互相寄递。
  收寄件人信息同样取自组织里维护的地址。

  【一句话区分】只有「消费者」能自由填地址，其余三种都必须用组织维护的地址。
