title: 第三方测评怎么导入参与人员？
one_liner: 在新增测评第三步选「名单导入」，下载模板填工号后上传，或改用「条件设置」按组织职级筛选。
body: |
  【位置】新增测评 → 第三步「选择参与人员」

  【方式一：名单导入】
  1. 点「点击下载」下载 .xlsx 模板
  2. 在模板中填写参与人员工号，不要改列头结构
  3. 点上传区域选文件，或直接拖拽到上传区域
  4. 系统解析后页面显示参与人数

  【方式二：条件设置】
  1. 按组织名称、职级、岗位等维度设置条件
  2. 至少填一项条件才生效
  3. 点刷新按钮查看符合条件的人数

  【上传会被拒绝的情况】
  · 文件不是 .xlsx 格式
  · 模板列头被改动
  · 工号格式错误或人员不存在

  【注意】两种方式切换会清空已添加的名单，切换前先确认
  【注意】参与人数超过 300 人，系统提示拆分活动
