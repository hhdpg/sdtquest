card_id: hr-trouble-no-type
type: trouble
title: 新增测评时选不到测评类型怎么办？
one_liner: 说明你还没有该类型的数据权限，点下拉旁「点击此处申请」提交申请，审批通过后刷新页面。
body: |
  【现象】新增第三方测评时，「测评类型」下拉框是空的，或没有你要的那个类型。

  【原因】下拉数据来自你被授权的外部测评类型列表，未授权的类型不会出现。

  【处理步骤】
  1. 点下拉框旁边的「点击此处申请」链接
  2. 选择需要申请的测评类型，提交数据权限申请
  3. 等审批通过
  4. 刷新页面，类型下拉会出现新增选项

  【如果还是没有】确认审批是否真的通过；仍未出现则联系 HRMI 系统管理员。
