card_id: hr-rule-assessment-publish
type: rule
title: 测评发布后还能改吗？
one_liner: 不能。已发布的活动不能编辑也不能删除，只能查看详情或复制后重新发布。
body: |
  【规则】活动一旦发布，配置即被锁定。

  【各状态下能做什么】
  · 草稿：可编辑、发布、删除
  · 未发布：可编辑、发布、删除
  · 已发布：只能查看详情、复制
  · 已结束：只能查看详情、复制

  【要改怎么办】
  1. 点「复制」，系统带入类型、名称、截止日期、场景、人群
  2. 重新选择参与人员（复制不会带入名单）
  3. 建议改名（加"_副本"或新日期）避免混淆
  4. 重新发布，然后手动结束原活动

  【发布前必查三件事】名单、截止日期、测评类型
  【为什么这么设计】发布即触达员工，中途改配置会导致作答数据不一致
