card_id: order-rule-approval-auto-reject
type: rule
title: 订单为什么自动被驳回了？
one_liner: 两种原因：一是预约取件时间已过还没人审，二是超过配置的审批时效阈值。
body: |
  【两种自动驳回的触发条件】

  ① 取件时间已过
  订单还在待审批，但预约的取件时间已经过期，系统自动驳回。

  ② 超过审批时效
  从下单到审批超过了系统配置的时效阈值，系统自动驳回。
  时效阈值由管理员在审批规则里设置。

  【驳回后会怎样】
  · 订单终止，不再向下游流转
  · **自动释放占用的运费预算配额**

  【怎么避免】
  · 关注取件时间紧的订单，优先审批
  · 按需调整审批时效阈值（需管理员权限）
  · 审批量大的时候注意batch限制：单次最多通过 1000 单

  【注意】审批通过的校验也有类似逻辑——
  审批通过那一刻如果取件时间已过（自送/一小时内取件除外），
  会被标记为「异常」并发企微通知，而不是静默通过。
