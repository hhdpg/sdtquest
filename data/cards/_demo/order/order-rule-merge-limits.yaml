card_id: order-rule-merge-limits
type: rule
title: 合单有哪些规则？箱号、尺寸、模板有什么要求？
one_liner: 同组织箱号不能重复；长宽高不能为负、保留 2 位小数；模板表头必须匹配预定义格式。
body: |
  【箱号唯一性】
  · 同一组织内，已成功合单过的箱号**不能重复**
  · 校验范围包括：跨行重复、历史重复
  · 是否启用校验由服务开通配置控制，不同组织可能不同
  · 校验天数也是配置化的，可能限制在最近 N 天内查重

  【尺寸要求】
  · 长宽高**不能是负数**
  · 保留 2 位小数
  · 体积不用手工填：体积 = 长 × 宽 × 高，系统自动算

  【导入限制】
  · Excel 导入行数有上限（由系统配置决定）
  · 模板表头**必须匹配新旧两种预定义格式之一**，否则解析失败
  · 新版模板的「发货日期」列移到了最后（重量之后）

  【合单不支持的功能】
  · 合单**不支持自选月结卡**

  【四同合并（团队服场景）】
  相同发货日期 + 寄件组织 + 收件地址 + 收件人 → 自动合并。
  **发货日期缺失的行不能参与四同合并。**

  【常见的合单报错】
  · 箱号重复 → 换箱号，或确认是否开启了唯一性校验
  · 模板解析失败 → 检查表头是否被改过
  · 发货日期缺失 → 补上发货日期才能四同合并
