card_id: order-rule-create-limits
type: rule
title: 下单有哪些限制？取件时间、货物数量有什么要求？
one_liner: 取件时间要晚于当前 2 小时；货物数量不填按 1 件算；跨境单货物数必须等于报关明细数。
body: |
  【取件时间】
  · 必须晚于当前时间**至少 2 小时**，否则下单失败
  · 可选小时数只有两种范围：0（当前小时内）或 9–69 小时
  · 超出范围的时间会被置空

  【货物数量】
  · 不填或填 0，系统按**1 件**处理
  · 货物列表为空但有货物信息时，会用货物信息生成一条货物记录

  【跨境单特殊要求】
  · 发件人和收件人都在中国大陆 → 国内单，否则是跨境单
  · 跨境单的货物数量**必须等于报关明细项的数量之和**
  · 跨境单要算声明价值：所有金额>0 的货物，金额×数量后求和
  · 只有当所有货物币种一致时，才设置单一币种

  【自联取件】
  选择「自行联系取件」时，系统必须调顺丰取件时间服务拿有效截止时间。

  【扫码下单】
  扫码场景下成本类型**只能是退货成本类型**，不允许选其他。
