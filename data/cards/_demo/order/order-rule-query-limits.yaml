card_id: order-rule-query-limits
type: rule
title: 为什么查不到订单？查询有什么限制？
one_liner: 查询时间跨度不能超过 31 天，结果最多 15000 条，太早的订单查不到。
body: |
  【三个限制】

  ① 时间跨度
  一次查询的时间范围**不能超过 31 天**。跨度太大要分批查。

  ② 最早查询时间
  不能早于系统配置的起始日期（cutoff 日期）。
  超出这个日期的订单不在可查范围内。

  ③ 结果数量
  总结果**不能超过配置的最大值（默认 15000 条）**。
  超出的话缩小时间范围或加筛选条件。

  【查不到订单时按顺序排查】
  1. 时间跨度是不是超过 31 天了？
  2. 查询日期是不是早于系统起始日期？
  3. 结果是不是超过了 15000 条被截断？
  4. 筛选条件（组织、状态、运单号）是否合适？
  5. 有没有权限看这个组织的数据？

  【大数据量的查询】
  超过一定量会走搜索引擎，可能比小数据量慢，属正常。
