card_id: order-trouble-missing-cost-type
type: trouble
title: 下单时提示「缺少成本类型」怎么办？
one_liner: 这个组织还没配该成本类型。找管理员到「业务配置 → 下单选项」对应规则里加上。
body: |
  【现象】下单时提示「缺少成本类型等，请联系管理员」。

  【原因】当前下单类型需要的成本类型，在下单选项里没有配置。
  例如下单类型是「客户退货」，只能使用退货类成本类型；
  如果没配退货类成本类型，就会报这个错。

  【处理步骤】
  1. 找有业务配置权限的管理员（一般是一级组织管理员）
  2. 进 业务配置 → 下单选项
  3. 选择你所在的组织
  4. 找到当前使用的下单规则，点左侧箭头展开
  5. 在「成本类型」tab 里点添加，填项目名和项目值
  6. 保存后**重新进入下单页**，下拉才会刷新

  【如果还是没有】确认下单规则的使用范围是否覆盖到你所在组织——
  没覆盖的组织会继承上级规则，可能实际生效的不是管理员改的那条。

  【同类报错】批量导入提示「非可用付款方式、非可用成本类型」
  → 原因相同，是表格里填的值和下单选项配置对不上。
  要么改表格内容，要么把该选项补进配置。

  【说明】不同组织配的成本类型不同，
  你们组织具体有哪些，**以下单页实际显示为准，我不能替你查**。
