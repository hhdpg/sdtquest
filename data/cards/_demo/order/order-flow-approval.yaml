card_id: order-flow-approval
type: flow
title: 订单审批流程是怎样的？下单后什么时候发出？
one_liner: 下单命中审批规则就进待审批，审批通过后才真正向顺丰下单；驳回或超时会自动终止。
body: |
  【什么时候会被审批】
  下单时，系统按成本类型、订单类型、付款方式、快递类型、货物等维度
  匹配审批规则，匹配上就进入「待审批」状态，**不会立即发到顺丰**。

  【流程】
  1. 下单 → 命中规则 → 状态「待审批」
  2. 审批人处理（通过 / 驳回）
  3. 通过 → 系统向顺丰下单 → 运单号生成
  4. 驳回 → 订单终止，同时**释放占用的运费预算**
  5. 超时 → 系统自动驳回（见自动驳回卡）

  【审批的两个限制】
  · 单次通过不超过 1000 单
  · 单次驳回不超过 200 单

  【审批通过后还要校验取件时间】
  如果取件时间已经过了（自送或一小时内取件除外），
  审批会被标记为「异常」，并发送企微通知。

  【怎么配审批规则】需一级组织管理员在「业务配置 → 审批规则设置」操作。
