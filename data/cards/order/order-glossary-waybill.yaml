card_id: order-glossary-waybill
type: glossary
title: 运单是什么？运单号和子运单号有什么区别？
one_liner: 运单是订单在顺丰那边的凭证，一单一个运单号；子运单是拆分出来的多个包裹号。
body: |
  【运单】
  订单提交到顺丰后，顺丰生成的服务凭证，对应一个运单号。
  订单是本地的概念，运单是承运商侧的概念，两者一一对应。

  【运单号 vs 子运单号】
  · **运单号（母单号）**：一票货的主号，下单后生成
  · **子运单号**：一票货拆成多个包裹时，每个包裹的号

  【子运单号的使用限制】
  · 只能在订单**未取件前**申请
  · 单票最多支持 **1000 个包裹**
  · 同城配送订单**不支持**子运单路由查询
  · 只有跨越速运（KYSY）支持通过物流中台添加运单号
  · 子运单被删除后，状态统一显示为「已取消」

  【用运单号能查什么】
  · 物流路由（只有 BSP 渠道来源的才支持查询）
  · 签收信息

  【查不到时】
  · 子运单号查不到 → 可能已删除，状态显示已取消
  · 打印批次号查不到 → 返回空，确认批次号是否输入正确
