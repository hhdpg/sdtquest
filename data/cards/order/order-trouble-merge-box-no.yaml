title: 合单时提示「箱号重复」怎么办？
one_liner: 同组织内这个箱号之前已经合过单了，会拦截。换箱号，或确认唯一性校验是否该关。
body: |
  【现象】批量合单导入时提示箱号重复，无法导入。

  【规则】
  同一组织内，**已成功合单过的箱号不能再次使用**。
  系统会做两类查重：
  · 同一批导入文件内，不同行用了同一个箱号
  · 和历史已合单的数据重复

  【处理办法】
  1. 换个没被用过的箱号
  2. 如果确实是全新的货、箱号可复用，找管理员确认
     箱号唯一性校验开关是否应该关闭
  3. 确认查重的天数配置是否合理（可能只查最近 N 天）

  【排查顺序】
  · 先看是不是同一文件里重复了
  · 再看是不是和最近的历史单重复
  · 最后确认校验开关和天数配置

  【几个相关限制】
  · 箱号长宽高不能为负，保留 2 位小数
  · 体积 = 长×宽×高，系统自动算，不用填
  · 导入模板表头被改过也会报错，注意别动表头

  【找不到原因时】把报错截图和所用的箱号发给管理员，查一下命中了哪条历史记录。
