title: 怎么查询运单？在哪查所有订单和导出？
one_liner: 运单管理 → 运单列表，填条件查询，点「+更多查询条件」展开；导出超过 1 万条转下载中心。
body: |
  【查运单入口】运单管理 → 运单列表

  【怎么查】
  1. 填查询条件，点【+更多查询条件】可展开更多条件
  2. 点【查询】，列出符合条件的运单
  3. 点【查询结果导出】导出查询到的数据

  【导出大数据的规则】
  超过 1 万条运单，导出任务会转到**下载中心**，
  次日 6 点后才能导出/下载。

  【下载中心】
  数据中心 → 下载中心，可按文档描述查正在导出的任务。
  **数据有效期 30 天，过期不再提供下载。**

  【各来源的单都在运单列表】
  顺丰运单、同城急送、API 对接、小程序、H5 的运单都可在此查看，
  可看路由信息和清单运费。

  【查不到订单？】先看查询时间和条数限制，
  31 天范围、结果条数上限等限制见「查不到订单」卡。

  【批量操作】运单列表还支持批量打印/打印指定面单、
  批量取消下单、批量取消运单、修改订单信息、增加包裹件数。
