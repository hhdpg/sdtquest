title: 合单有哪些规则？箱号、尺寸、模板有什么要求？
one_liner: 同组织箱号不能重复；长宽高不能为负、保留 2 位小数；模板表头必须匹配预定义格式。
body: |
  【箱号唯一性】
  · 同一组织内已合单过的箱号**不能重复**（含同批跨行、历史重复）
  · 是否启用校验由服务开通配置控制，不同组织可能不同
  · **查重窗口默认 30 天**，可按组织配置；配成 0 视为不限期

  【尺寸要求】
  · 长宽高**不能是负数**，保留 2 位小数
  · 体积 = 长 × 宽 × 高，系统自动算，不用手工填

  【导入限制】
  · Excel 导入行数有上限（由系统配置决定，超了直接报错）
  · 模板表头**必须匹配预定义格式**，否则解析失败

  【合单不支持】合单**不支持自选月结卡**（按业务代号自选也不行）

  【四同合并（团队服场景）】
  key = 发货日期(yyyy-MM-dd) + 寄件组织编码 + 收件地址 + 收件人，
  **不含收件人电话、收件组织**。四项全同 → 自动合并。
  **发货日期缺失的行不能参与四同合并。**
  另有按标签 / 按件数区间 / 按体积区间 / 按导入等选单方式。

  【常见报错】
  · 箱号重复 → 换箱号，或确认是否开启了唯一性校验
  · 模板解析失败 → 检查表头是否被改过
  · 发货日期缺失 → 补上发货日期才能四同合并
