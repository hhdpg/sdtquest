card_id: order-glossary-value-added
type: glossary
title: 订单有哪些增值服务？保价、代收货款怎么用？
one_liner: 常用有保价、代收货款、签回单、密码签、定时派送、木质包装等，下单时按需勾选。
body: |
  【常见增值服务】
  · **保价**——货物声明价值，出险按保价赔
  · **代收货款**——帮寄件方收买家货款
  · **签回单**——要客户签收凭证（纸质或电子）
  · **密码签**——收件时需报密码才签收
  · **等通知派送**——到目的地后等指令再派
  · **定时派送** / **及时派送保障**
  · **特殊仓库核验**
  · **木质包装**
  · **尚派服务**

  【几个使用要点】
  · **微签服务**：使用前必须先有微签服务配置，否则用不了
  · **强制保价**：配置了强制保价的物品，下单时必须选保价
  · **尚派服务**：只有当传值明确为「1」时才会下发，其他值不下发
  · **保价金额单位**：某些渠道保价以「分」存储，展示要转成「元」

  【在哪配置】
  业务配置 → 下单选项 → 对应规则 → 增值服务 tab

  【具体哪些服务你们组织能用】
  以下单页实际显示为准，我不能替你查。
