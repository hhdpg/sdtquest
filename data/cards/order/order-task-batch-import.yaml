card_id: order-task-batch-import
type: task
title: 怎么批量下单？Excel 批量导入有什么要求和限制？
one_liner: 运单管理 → 批量下单 → 运单批量导入，下载模板填写上传；单次最多约 3000 行，失败行会写回 Excel 提示列。
body: |
  【入口】运单管理 → 批量下单 → 运单批量导入

  【流程】
  1. 点【下载导入模板】用官方模板
  2. 按模板填好每行运单信息
  3. 点【上传文件】完成导入
  4. 下单进度在【查看任务】里看

  【单次上限】
  · 单次导入**最多约 3000 行**，超了提示
    「导入失败！超过导入上限，请分次导入」
  · 文件过大会直接拒，按提示分批导入

  【哪些列必须填】
  · 成本类型、业务类型、物品、件数
  · 个人成本类型：收件人、电话、地址都要填
  · 公司/卖场成本类型：收件门店编码要有效
  · 寄件人/电话/地址为空时，系统自动用
    **登录人 + 登录人所属组织地址**补全

  【填错了会怎样】
  导入不是整批失败，而是**逐行校验**：
  成功的照常下单，失败的行把原因写进 Excel 的「提示」列，
  生成一个结果文件给你下载，改完再传。

  【自定义模板】
  用自定义模板导入时，哪些字段必填由模板配置决定，
  不一定是系统默认的必填项。

  【常见逐行报错】
  · 非可用成本类型 / 非可用付款方式 → 填的值和下单选项对不上
  · 联系人、联系方式、地址错误 → 格式或字符问题
