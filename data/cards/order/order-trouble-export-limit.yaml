card_id: order-trouble-export-limit
type: trouble
title: 为什么导不出订单？提示「导出数量超限」怎么办？
one_liner: 数量超了即时导出上限，改用延迟导出；延迟导出每人每天最多 5 次，且同天不能重复导同样内容。
body: |
  【现象】点导出没反应，或提示超过导出上限。

  【两个导出通道】

  ① 即时导出
  有数量上限（由配置决定）。数量少时用这个，立刻下载。

  ② 延迟导出
  数量超过即时上限时用。但有几个限制：
  · 订单数量要超过一个最小阈值才能用
  · **每个账号每天最多用 5 次**
  · **相同参数 + 同一用户 + 同一天，不能重复导出**（幂等限制）

  【处理办法】
  1. 先缩小筛选范围（时间、组织、状态），减少数量
  2. 如果确实要多，用延迟导出
  3. 延迟导出当天次数用完了，只能等第二天

  【特殊场景】
  · 合单导出：数据量不能超过 Excel 单文件上限，超了要分批导
  · O2O 订单导出：有独立的上限配置，超过直接返回空数据

  【如果一直导不出】确认是不是当天已经用完了 5 次延迟导出额度。
