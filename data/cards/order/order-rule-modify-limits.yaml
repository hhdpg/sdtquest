card_id: order-rule-modify-limits
type: rule
title: 订单下单后还能改吗？改地址、改产品有哪些限制？
one_liner: 只有「未收件」状态能改；商圈店配和普通产品不能互改；改完不重新走审批。
body: |
  【能改的前提】
  · 订单状态必须是**未收件**（已下单、还没取件）
  · 已取件的订单改不了
  · 操作人要有该订单的权限，且所属一级组织配好了顾客编码和校验码
    没配会提示「顾客编码,效验码没有配置，请联系管理员配置」

  【能改哪些字段】
  寄件姓名、寄件电话、收件姓名、收件电话、收件地址、
  顺丰业务类型、取件时间、保价等增值服务。

  【改不了的情况】
  · **商圈店配（SQDP）和普通产品不能互改**，
    提示「商圈店配订单暂无法修改，您可取消重新下单！」
    真要换，取消后重新下单
  · 基础保金额不能填 0，提示「基础保金额不可填0」

  【批量改产品类型】
  · 单次**最多 100 单**，超了提示「单次批量修改最多支持100单」
  · 逐单处理，某单失败不影响其他单，失败的会返回原因列表

  【改完会重新审批吗】
  **不会。** 修改只调顺丰确认接口并回写订单，不会重新走审批流程。
  所以本来该审批的单，改完也不会自动补审批。

  【常用入口】运单管理 → 运单列表 → 修改订单信息
