card_id: order-rule-cancel-delete
type: rule
title: 订单什么时候能删除？什么时候能取消？
one_liner: 只有未取件的订单能删，且来源和组织都要符合；已取件后只能走取消流程。
body: |
  【删除的三个条件，必须同时满足】
  1. **状态**：只能删未取件的订单（还没到「已取件」状态）
  2. **来源**：只有这几种来源的订单能删
     · 管理后台批量导入
     · 管理后台单独下单
     · 开放服务器
     · 合单管理
     · 第三方月结批量订单
  3. **组织**：操作人必须和订单所属**一级组织一致**

  【不满足时】
  删除按钮点了不生效，或直接报错。常见两种报错原文：
  · 「只能删除未收件的订单」→ 说明已经是已取件及之后的状态
  · 「只能删除本地批量导入的订单或者是新建的订单及开发接口订单」
    → 说明这单来源不对（常见是小程序下的单）
  · 小程序下单的订单，只能回小程序「查快递」里删，PC 端删不了

  【已取件的订单】
  不能删除。需要终止的话走取消流程。

  【取消和删除的区别】
  · 删除：订单从列表移除，属硬操作
  · 取消：订单状态变为「已取消」，记录还在，可查历史

  【提醒】已发布审批流程中的订单，建议先撤回审批再处理。
