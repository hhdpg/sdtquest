card_id: order-rule-cancel-delete
type: rule
title: 订单什么时候能删除？什么时候能取消？
one_liner: 只有未取件的订单能删，且来源和组织都要符合；已取件后只能走取消流程。
body: |
  【删除的三个条件，必须同时满足】
  1. **状态**：只能删未取件的订单（status < 已取件）
  2. **来源**：只有这几种来源能删
     · 管理后台批量导入
     · 管理后台单独下单
     · 开放服务器（API 对接）
     · 合单管理
     · 第三方月结批量订单
     · 商家助手下单
  3. **组织**：操作人要能管到该订单所属组织
     （本级、下级或监管组织范围，不要求完全同一级）

  【小程序单的特殊限制】
  小程序（含场景码）下的单，来源只允许小程序/场景码，
  **PC 端删不了、也取消不了**，要回小程序「查快递」里操作。

  【不满足时】常见报错原文：
  · 「只能删除未收件的订单」→ 已取件及之后的状态
  · 「只能删除本地批量导入的订单或者是新建的订单及开发接口订单」
    → 来源不在白名单（最常见是小程序单）
  【已取件的订单】不能删除，要终止就走取消流程。

  【删除 vs 取消】
  · 删除 = 取消 + 逻辑删除，从列表移除
  · 取消 = 状态变「已取消」，记录还在可查

  【额度自动退回】取消运单后，占用的运费预算额度自动退回。
