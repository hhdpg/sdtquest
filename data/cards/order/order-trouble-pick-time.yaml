card_id: order-trouble-pick-time
type: trouble
title: 下单提示取件时间不合法怎么办？
one_liner: 取件时间必须晚于当前 2 小时以上，只能选 0（当前小时内）或 9–69 小时。
body: |
  【现象】下单或改单时，取件时间报错，或者选好的时间提交后被置空。

  【规则】
  · 预约取件时间必须**晚于当前时间至少 2 小时**
  · 可选小时数只有两种合法范围：
    · 0：当前小时内取件
    · 9–69：9 小时后到 69 小时后（约后天）
  · 超出这个范围的时间，系统会把时间**置空**

  【处理办法】
  1. 确认你选的时间在当前时间 2 小时之后
  2. 如果选的是 3–8 小时这个区间，系统不支持，改选 9 小时以后
  3. 特别急的，考虑当前小时内取件（选 0）

  【自行联系取件的情况】
  选「自行联系取件」时，系统会调用顺丰的取件时间服务，
  拿到一个有效截止时间。如果取不到，下单会失败。

  【审批通过时也会校验】
  审批通过那一刻，如果取件时间已过（自送或一小时内取件除外），
  订单会被标记为「异常」，并发送企微通知。

  【改时间的建议】
  取件时间快到了还没审批的订单，优先催审批。
