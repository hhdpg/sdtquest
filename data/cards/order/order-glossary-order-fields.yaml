card_id: order-glossary-order-fields
type: glossary
title: 下单页这些字段分别是什么意思？成本类型、计价类型、付款方式有什么区别？
one_liner: 下单类型决定寄件场景，成本类型决定费用归到哪，计价类型决定按重量还是按箱算，付款方式决定谁付钱。
body: |
  【下单类型】决定这笔单属于哪种业务场景，切换后页面字段会变。
  常见四种：
  · 标准下单——最常规的寄件，收寄件人可自由填
  · 异地代发——替别人发货，寄件方在异地
  · 调拨下单——门店/仓之间调货，收寄双方都是自己组织
  · 客户退货——消费者把货退回来，收件方是自己组织

  【成本类型】决定这笔运费算在哪个业务口径上，用于对账和成本分析。
  不同下单类型可配的成本类型不同，例如退货场景只能用退货类成本类型。
  具体有哪些，以你们组织的下单选项配置为准。

  【计价类型】决定运费怎么算。
  · 按重量
  · 按箱双袋件
  只在物流公司选顺丰时才出现。

  【付款方式】决定谁付这单运费。
  · 寄付——发件方付
  · 到付——收件方付
  · 月结——挂月结卡号统一结算

  【月结卡号】选月结付款时才要填，必须是已校验通过的月结账号。

  【说明】以上选项的具体可选值随组织配置不同而不同，
  **以下单页实际显示为准，我不能替你查**。
