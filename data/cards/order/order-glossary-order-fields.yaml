card_id: order-glossary-order-fields
type: glossary
title: 下单页的成本类型、计价类型、付款方式分别是什么意思？
one_liner: 成本类型决定费用归到哪，计价类型决定按重量还是按箱算，付款方式决定谁付钱。
body: |
  【成本类型】决定这笔运费算在哪个业务口径上，用于对账和成本分析。
  不同下单类型可配的成本类型不同，例如退货场景只能用退货类成本类型。
  具体有哪些，以你们组织的下单选项配置为准。

  【计价类型】决定运费怎么算。
  · 按重量
  · 按箱双袋件
  只在物流公司选顺丰时才出现。

  【付款方式】决定谁付这单运费。
  · 寄付——发件方付
  · 到付——收件方付
  · 月结——挂月结卡号统一结算

  【月结卡号】选月结付款时才要填，必须是已校验通过的月结账号。

  【说明】以上选项的具体可选值随组织配置不同而不同，
  **以下单页实际显示为准，我不能替你查**。
  四种下单类型分别是什么、该选哪个，见「下单类型区别」卡。
