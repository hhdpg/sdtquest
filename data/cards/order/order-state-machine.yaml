card_id: order-state-machine
type: glossary
title: 订单都有哪些状态？分别是什么意思？
one_liner: 导入→已下单→已取件→运输中→派送中→已完成；中间可能进待审批、异常或取消。
body: |
  【按业务流程顺序】

  · **导入**
  订单已创建，还没提交给顺丰。这状态可继续处理或删除。

  · **已下单**
  顺丰侧已创建，运单号已分配。

  · **已取件**
  快递员已取件。**过了这个状态，部分操作就不能做了**
  （比如不能申请子运单号、不能删除）。

  · **运输中**
  在途运输。

  · **派送中**
  正在派送。

  · **已完成**：派送成功。

  【其他分支状态】
  · **无法下单**——订单没建成，被校验拦下
  · **已取消**——查询用，表示订单被取消
  · **待审批**——命中审批规则，等人审
  · **审批通过**——继续向下游下单
  · **已驳回**——审批未通过，订单终止
  · **异常件**——可疑单/被拒单

  【查状态】列表「订单状态」列直接显示。同城急送单「未收件」阶段文案可能不同，底层同一状态。
