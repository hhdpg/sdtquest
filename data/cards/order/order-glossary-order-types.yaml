card_id: order-glossary-order-types
type: glossary
title: 标准下单、异地代发、调拨下单、客户退货有什么区别？该用哪个？
one_liner: 标准=本地发货给客户；异地代发=外地灵活收寄；调拨=门店间调货（涉及三方）；客户退货=逆向寄回。
body: |
  【四种下单类型，按场景选】

  · **标准下单**：门店发件给消费者/客户。寄件地址取组织维护地址，
    姓名电话可改；收件信息可自由填。

  · **异地代发**：外地出差、外地有代发工厂等。
    寄件地址可自由填；收寄都灵活。

  · **调拨下单**：门店间调货，涉及**三方**：申请方（下单方）、寄件方、
    收件方。申请方一般是缺货/调拨方，寄件地址取组织维护地址。
    费用由哪方承担可在月结规则里单独设置。

  · **客户退货**：客户把货退回门店/仓库，或文件礼品寄回内部组织。
    **收件地址必须是组织维护的地址且不可改**；成本类型只能用「退货」；
    **不能用寄付月结**（见退货付款方式卡）。

  【选型口诀】
  往外发 → 标准；异地不固定 → 异地代发；
  门店之间调 → 调拨；往回寄 → 客户退货。

  【成本类型限制】
  标准、异地代发、调拨三种可用除退货外的成本类型；
  客户退货只能用退货类成本类型。

  【共同点】
  都要填收寄件人、货物信息，下单后都可能走审批，
  受限都一样（取件时段、订单号唯一、货物数量规则）。

  【说明】批量下单（Excel 导入）是另一个入口，见「批量导入订单」卡。
  成本类型、计价类型、付款方式等字段含义，见「下单页字段」卡。
