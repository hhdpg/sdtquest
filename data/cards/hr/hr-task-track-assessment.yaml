title: 怎么查看测评进度、催办未作答的人？
one_liner: 列表页直接看「发送数量」和「回收数量」两列；要催办就进详情筛「未作答」导出名单。
body: |
  【列表页快速判断】
  进入「第三方测评」列表，看两列：
  · 回收数量接近发送数量 → 进度良好
  · 两者差距大 → 需要催办

  【催办步骤】
  1. 点测评名称进详情页
  2. 参与人员列表按作答状态筛「未作答」
  3. 点「导出」导出未完成名单（Excel）
  4. 把名单发给对应 HR，或通过邮件/消息通知员工

  【统计口径】
  · 发送总数 = 已发送问卷的人数
  · 回收总数 = 已提交问卷的人数
  · 回收率 = 回收总数 / 发送总数

  【建议节奏】截止前 1 天导出未完成名单集中催办
