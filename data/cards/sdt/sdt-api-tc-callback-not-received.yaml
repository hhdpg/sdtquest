card_id: sdt-api-tc-callback-not-received
type: rule
title: 同城回调一条都没收到，怎么排查？
one_liner: 先查订单是否在本地存在，再查回调地址配置，最后查网络白名单。
body: |
  【注意：这里说的是「顺店通推给你」的回调】

  这些回调是从顺店通推向你提供的地址，
  方向和你调接口是反的。所以你收不到，问题可能在你这侧。

  【排查顺序】

  **1. 订单在本地存在吗**
  这是第一位的。回调处理时会按同城订单号查本地单，
  **查不到就直接返回成功，什么都不做**。

  所以：「回调可能到了，但没更新数据」和「回调根本没到」
  在日志上的表现是不一样的，要区分开。

  建议你先在自己服务端打一下访问日志，
  确认是否真的有请求进来。

  **2. 回调地址配了吗**
  同城回调的地址是在配置里维护的，
  不是在调用接口时传的。配置缺失就不会推。

  **3. 你的地址能从外网访问吗**
  顺店通的服务在内部网络。
  如果你的地址只在内网可达，需要走代理或者白名单放行。

  **4. 你返回的是成功吗**
  必须返回「错误码 0 + success」。
  返回其他任何内容都会被视为失败，
  而且**不会重推**，等于这条回调永久丢失。

  【五个回调路径，确认接全了】
  · 状态变更
  · 订单完成
  · 顺丰原因取消
  · 订单异常
  · 建店结果同步

  少接一个，对应的场景就没有通知。

  【一个安全提醒】
  回调接口没有签名校验，
  建议你在网关层加 IP 白名单，
  否则地址泄露后可以被伪造回调。
