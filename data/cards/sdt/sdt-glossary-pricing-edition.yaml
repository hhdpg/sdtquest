title: 顺店通有哪些版本？标准版、专业版、高级版、旗舰版有什么区别？
one_liner: 版本区别：标准版打基础、专业版加财务对账和合单、高级版加智能监控和工单、旗舰版加调度和 O2O。
body: |
  【版本怎么区分】按功能逐层叠加，高版本包含低版本全部功能。

  · **标准版（约 3800 元/年）**
    多组织/多用户/多月结；快递与同城下单、订单审批、
    到付月结码、收单码；下单选项/规则/审批配置；数据报表。

  · **专业版（约 9800 元/年）**
    标准版全部 + 合单（含合单规则）+ 财务管理
    （运单对账、物流成本对账、月结设置）+ 企微授权。

  · **高级版（约 19800 元/年）**
    专业版全部 + 智能监控（监控管理、规则设置、数据看板）
    + 工单管理 + 门店运费预算管控。

  · **旗舰版（约 59800 元/年）**
    高级版全部 + 物流智能调度 + O2O 管理（店铺、电子面单授权、
    O2O 下单）+ 门店要货补货、商品中心、库存查询、仓库配置。

  【付费功能还要单独开】
  智能监控工单、同城急送、物流调度、合单中心、财务管理、
  到齐派、O2O 电子面单等，即使版本里含，也要发邮件单独开通。

  【说明】价格和套餐以销售报价和实际合同为准，
  具体你们买了哪个版本、开了哪些付费模块，以下单合同为准，我不能替你查。
