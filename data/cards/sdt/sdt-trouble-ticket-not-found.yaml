card_id: sdt-trouble-ticket-not-found
type: trouble
title: 新建工单提示「未查到关联订单」怎么办？
one_liner: 运单号不对或还没进系统。先核对运单号，只有重启系统下单或月结拉取的运单才查得到。
body: |
  【报错原文】新建工单时提示「未查到关联订单」。

  【原因】工单必须挂在一张系统认得的运单上，但：
  1. 运单号输错了（多一位、少一位、抄错）
  2. 该运单**还没进入顺店通系统**
     ——工单只能基于「本系统下的单」或「用月结卡号拉取进来的运单」

  【怎么处理】
  1. 回到原始单据核对运单号，重新输入
  2. 确认这张单是顺店通下的，或已通过月结卡号拉进智能监控
  3. 如果是别的渠道的单、又没拉取，就查不到，无法建工单

  【和「通用单号」区分】
  工单里填的是**承运商运单号**（顺丰运单号），
  不是客户自己内部的订单号。填错成内部订单号也会查不到。

  【建单前先点一下空白处】
  输入运单号后在空白处点一下，系统会带出运单信息和历史工单，
  带不出来基本就是查不到，先别急着提交。
