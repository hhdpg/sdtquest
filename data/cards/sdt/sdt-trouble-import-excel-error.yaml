card_id: sdt-trouble-import-excel-error
type: trouble
title: 导入用户报错「导入excle出错」怎么办？
one_liner: 检查三点：员工账号有重复、单元格有空格、角色ID不是文本格式。
body: |
  【报错原文】批量导入用户账号时报「导入excle出错」。

  【三个最常见原因，逐个查】
  1. **员工账号有重复值**
     → 表格里同一员工账号出现多次，删掉重复行
  2. **单元格里有空格**
     → 账号、姓名等单元格首尾或中间有多余空格，删掉空格
  3. **角色ID不是文本格式**
     → 把角色ID整列设成「文本」格式，避免前导 0 被吃掉 /
       变成科学计数法

  【处理顺序】
  先把重复值删掉 → 全选单元格清空格 → 角色ID列改成文本 → 重新导入。

  【和「联系人、联系方式、地址错误」区分】
  那条报错是导入运单时地址信息有问题；
  本条「导入excle出错」是**导入用户账号**时的表格格式问题，
  两者不是一个场景，别混。

  【提示】导入前先点【下载导入模板】用官方模板填，
  不要用自己建的表格，能避免大部分格式错误。
