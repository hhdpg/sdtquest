card_id: sdt-api-fee-push-trouble
type: trouble
title: 清单运费推送没收到？为什么有的推有的不推？
one_liner: 先查组织有没有配推送配置，再查你返回的码，400 会被判定失败不再重试。
body: |
  【这是顺丰出账后顺店通主动推给你的】
  不是你去查，是把顺丰的运费数据转发给你。收不到可能是配置、你的响应、或顺丰还没出账。

  【排查顺序】

  **1. 组织配了推送配置吗（最常见）**
  要同时满足：有这个一级组织的配置、状态启用、接收地址和密钥都填了。
  三缺一就不推，而且**静默跳过不报错**。

  **2. 你返回的是 200 吗**
  系统只认响应体的成功码 = 200：
  · 200 → 成功
  · **400 → 业务拒绝，不重试**，只记错误通知运维
  · 其他或非合法 JSON → 失败，会重试

  **3. 顺丰那边出账了吗**
  数据来源是顺丰的清单运费推送，顺丰没出账就没数据可推。

  **4. 订单组织对得上吗**
  按订单找到所属一级组织再用该组织配置推，组织配错就推不到。

  【重试和补救】
  先同步重试 3 次（间隔 500ms），都失败进重试表，隔天定时任务重推，每条最多 3 次。
  重推前会重新生成请求 ID、时间戳、签名。所以验签根因在时钟或算法上，重推也不会成功。

  【一个容易忽略的细节】
  同一个订单号的多次推送会**合并刷新**，不是每次新增一条。重试表记录数比实际推送次数少。

  【数据内容】
  顺丰原始运费明细**原样透传**，不做业务转换：运单号、子单号、月结账号、
  计费重量、实际重量、体积、产品名称、包裹数量、费用明细列表。
  字段含义按顺丰的定义理解。
