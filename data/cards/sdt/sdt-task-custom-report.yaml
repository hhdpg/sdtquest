title: 我的报表怎么建？为什么取数的字段里没看到「体积」？
one_liner: 数据中心 → 我的报表新增，勾选要统计的字段并选取数方式；取数字段取决于报表维度，取数次日 6 点后下载。
body: |
  【入口】数据中心 → 我的报表 → 新增报表

  【怎么建】
  1. 点【新增报表】
  2. 填报表名称
  3. 选报表类型：明细表 / 统计表
  4. 勾选需要统计的字段
  5. 选取数方式：自动取数（要选取数周期）或手动取数
  6. 点【保存】

  【取数】
  在报表列表点【取数】，选取数时间区间，
  系统按报表设置的字段取数，数据进**下载中心**，
  **次日 6 点后方可下载**。

  【为什么没看到「体积」字段】
  可选字段取决于你选的**报表维度 / 类型**。
  某个字段没出现，通常是：
  · 当前报表类型不统计该字段
  · 该字段在当前维度下不可选
  换合适的报表类型或维度再看字段列表。
  如果确实需要但列表里始终没有，联系项目组确认。

  【提示】报表按顺丰母单/子单/订单发货等维度建，
  不同角色（管理员、财务）适合的报表不一样，按用途选维度。
