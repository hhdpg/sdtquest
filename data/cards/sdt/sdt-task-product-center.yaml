card_id: sdt-task-product-center
type: task
title: 商品中心是干什么的？商品、分类、品牌、单位怎么用？
one_liner: 商品中心维护商品/分类/品牌/单位，供收单下单选品和要货补货按 SKU 用；商品停用会影响下单。
body: |
  【商品中心包含什么】
  · 商品管理：商品的规格、SKU、图片（支持批量导入）
  · 商品分类：新增分类 / 子分类
  · 商品品牌：新增品牌 / 子分类
  · 商品单位：新增单位（系统预置单位不可删）

  【用在哪里】
  · **收单下单**：顾客在小程序按商品选品下单，
    商品下架（停用）会提示不能下单
  · **要货/补货**：按 SKU 做要货和补货建议
  商品中心是这两条供应链链路的基础数据。

  【新增商品】
  商品管理 → 新增商品，填基本信息、规格，支持批量导入。

  【删除限制】
  · 系统预置的单位不可删除
  · 被商品引用的单位/分类不可删除
  · 商品停用/上架切换时，若有关联的未完结要货单占用库存，
    系统会提示确认后再操作

  【说明】具体商品、分类怎么规划属于业务配置，
  以商品中心实际数据为准，我不能替你查。
