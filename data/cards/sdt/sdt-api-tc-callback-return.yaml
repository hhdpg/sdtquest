card_id: sdt-api-tc-callback-return
type: rule
title: 同城回调必须返回什么？返回失败会重推吗？
one_liner: 必须返回错误码 0 加 success；返回失败也是 200 状态码，且不会自动重推。
body: |
  【必须返回这个结构】
  响应体包含：错误码 = 0、错误信息 = success。这两个值对上才算接收成功。

  【返回失败会怎样（两个关键点）】

  **1. HTTP 状态码还是 200**
  即使你返回失败标志，HTTP 也是 200，对方监控看不出你在报错。

  **2. 不会自动重推**
  系统里没有任何重试机制。你返回失败，这条回调就**永久丢了**。

  【所以你必须自己做兜底】
  · 接收后**先落库再返回成功**，不要先返回成功再异步处理
  · 落库失败就返回失败标志，但要接受「返回失败就不会重来」
  · 实务做法：接收时先把报文原样存一行，再返回成功，后续异步处理

  【五个回调路径，按路径区分】
  状态变更、订单完成、顺丰原因取消、订单异常、建店结果同步。
  **不是靠报文里的字段区分**，是五个不同路径。

  【回调没有签名校验】
  这是要注意的安全问题：回调接口完全不验签，任何人拿到地址都能伪造。
  建议在网关或应用层加一层：IP 白名单，或者 URL 里带只有双方知道的随机串。

  【按订单号查不到时的行为】
  查不到本地单**直接返回成功**，不报错。
  所以「回调处理了但什么都没发生」，第一件事是确认单号在本地存在。
