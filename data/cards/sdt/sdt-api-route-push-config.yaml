card_id: sdt-api-route-push-config
type: rule
title: 路由推送要配哪些东西？为什么配了还是收不到？
one_liner: 每个组织一套：地址、应用 ID、密钥、产品标识、推送方式，五项全要。
body: |
  【每个组织一套配置，不是全局一套】
  路由推送是按组织配置的。
  同一个客户有多个一级组织，就要配多套。

  【五项必填】

  **1. 推送地址**
  你的接收 URL。没配就完全不推。

  **2. 应用 ID**
  **注意：这个不是验签用的接口应用 ID**，
  可以是另一个值，会放在推送报文的头字段里。
  你要用这个值去对应校验。

  **3. 密钥**
  用来生成推送报文的签名。你那边要用同一个密钥验签。

  **4. 产品标识**
  也参与签名，放在头字段里。用来区分不同产品线。

  **5. 推送方式**
  四种：
  · 普通明文
  · 普通 + 内容加密（用你方公钥加密报文）
  · 特定银行定制
  · 特定客户定制

  **选错了你会看到乱码或解析失败。**

  【配了还是收不到，按顺序查】
  1. 推送方式和你代码里处理的是不是一个（选加密却按明文解析）
  2. 应用 ID 和密钥是不是双方一致
  3. 你的接口是不是返回了 200
  4. 这个运单的组织和配置的组织是不是同一个

  【一个常见混淆】
  **系统里有两套推送，配置不通用**：路由推送（物流节点）和
  运单信息推送（重量、体积、揽收签收时间）。只配了其中一套，另一套不会来。

  【签名怎么算】
  参与签名的字段不止一个，包括应用 ID、密钥、产品标识、
  运单号、订单号、时间戳等，按固定规则拼接后算摘要。
  具体顺序要按对接文档实现，不要自己猜。
