card_id: sdt-api-route-push-config
type: rule
title: 路由推送要配哪些东西？为什么配了还是收不到？
one_liner: 每个组织一行记录：地址、应用 ID、密钥、产品标识、推送方式，五项全要。
body: |
  【按组织配，一个组织一行】
  路由推送配置在数据库表里，每个组织一行，不是全局一套。

  【五项必填】

  **1. 推送地址**
  你的接收 URL。空着就完全不推，只打一行错误日志。

  **2. 应用 ID**
  **不是验签用的接口应用 ID**，是单独配的，放在推送报文头里，你用它对应校验。

  **3. 密钥**
  用来生成推送签名，你那边要用同一个值验签。

  **4. 产品标识**
  也参与签名，放在头字段里，用来区分产品线。

  **5. 推送方式**
  四种：普通明文 / 普通 + 内容加密（你方公钥加密报文）/
  特定银行定制 / 特定客户定制。

  **选错了会看到乱码或解析失败。**

  【每行还有一个启用状态】停用等于没配，同样不推。

  【配了还是收不到，按顺序查】
  1. 推送方式和你代码里处理的是不是一个（选加密却按明文解析）
  2. 应用 ID 和密钥是不是双方一致
  3. 你的接口是不是返回了 200
  4. 运单所属组织和配置的组织是不是同一个

  【一个常见混淆】
  **系统里有两套推送，配置不通用**：路由推送（物流节点）和
  运单信息推送（重量、体积、揽收签收时间）。只配了其中一套，另一套不会来。

  【签名怎么算】
  参与签名的字段不止一个（应用 ID、密钥、产品标识、运单号、
  订单号、时间戳等），按固定规则拼接后算摘要。顺序按对接文档实现，不要猜。
