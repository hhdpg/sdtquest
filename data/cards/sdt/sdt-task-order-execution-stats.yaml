type: task
title: 订单执行统计在哪看？能查哪些物流公司、按什么维度统计？
one_liner: 数据中心 → 订单执行统计，看各物流公司运单的在途路由和服务质量，可按物流商/渠道/组织查询。
body: |
  【入口】数据中心 → 订单执行统计

  【能看什么】
  · **在途路由**：顺丰、京东、EMS、德邦等物流公司的运单物流轨迹
  · **服务质量**：监控各家物流公司的时效、履约表现
  适合做承运商对比和异常发现。

  【怎么查】
  支持按这三个维度筛选：
  · 物流商
  · 下单渠道
  · 组织

  点【更新】可刷新数据表（拿的是最新数据）。

  【和「我的报表」的区别】
  · **订单执行统计**：系统内置的执行/路由看板，直接看
  · **我的报表**：自己新建统计字段和取数周期的自定义报表，
    取数结果进下载中心，**次日 6 点后才能下载**

  【下载中心有效期】
  取数结果在下载中心保留 **30 天**，超过后不再提供下载，要重新取数。

  【说明】具体指标口径（时效怎么算、异常怎么判定）
  以系统页面显示为准，我不能替你查。
