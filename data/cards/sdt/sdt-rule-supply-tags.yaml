title: 为什么选不到仓库？「仓库」标签和发货仓库的对应关系是怎样的？
one_liner: 发货仓库、WMS仓库这些下拉只能选到打了「仓库」标签的组织，没打标签的组织不会出现。
body: |
  【规则】
  多个地方的下拉只认**打了【仓库】标签的组织**：
  · WMS对接设置的「仓库」
  · 要货单的「发货仓库」

  组织没打【仓库】标签，这些下拉里就**选不到**它。

  【会碰到的情况】
  · 新建要货单时，明明有那个组织，发货仓库里却没有
  · 配 WMS 对接，仓库下拉是空的

  【怎么办】
  去组织管理给对应组织打上【仓库】标签，再回来选。

  【顺带说明】
  · 要货单的「收货信息」取自**组织里维护的收件人信息**
  · 「商品」只能选商品管理中维护过的商品
  三者都依赖组织/主数据先配好，没配好就选不到。

  【说明】标签怎么加、哪些组织该打仓库标签，
  属于组织规划，以你们实际配置为准，我不能替你查。
anchors: [选不到仓库, 仓库标签, 发货仓库为空, 组织标签, 要货单选不到仓库, WMS仓库选不到]
