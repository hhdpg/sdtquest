type: trouble
title: 为什么会出现重复的运单号？
one_liner: 客户用了带幂等的个性化顾客编码，同一个订单号下单会返回同一个运单号。
body: |
  【现象】不同订单/多次下单，却拿到了同一个运单号。

  【原因】
  客户使用了**个性化的顾客编码**，
  且该顾客编码里**配置了幂等**。
  这样同一个订单号下单后会返回相同的运单号，
  不会生成新运单。

  【和「订单号已存在」区分】
  · 「订单号已存在」→ 是订单号重复下不了单（拒单）
  · 「重复运单号」→ 是单能下，但返回的运单号跟之前一样
  两者一个卡在订单号、一个卡在顾客编码幂等配置。

  【怎么处理】
  · 这是顾客编码的幂等特性决定的，不是系统 bug
  · 需要每次下单都生成新运单号，就不要在顾客编码里配幂等
  · 已经有重复运单号，找销售/技术确认该顾客编码的幂等配置

  【提示】只有用了「个性化顾客编码」的客户会遇到，
  用系统默认顾客编码的不会。
