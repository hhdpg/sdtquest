card_id: sdt-flow-ticket-process
type: flow
title: 异常工单的处理流程是怎样的？品牌方和客服分别做什么？
one_liner: 品牌方建单 → 审批 → 承运商客服处理 → 关闭；自动类工单直接下发大网，处理完系统自动更新状态。
body: |
  【有几种工单类型】
  拦截、转寄、退回、再派、改自取、改派送、改派送时间、
  修改收件人联系方式、破损、遗失、理赔等。

  【整体流程】
  1. **品牌方建单**
     运营/客服在工单操作台新建工单，按工单类型填必填项提交。
  2. **审批（可选）**
     需要审批的客户，审批角色审批：同意→下一环节；不同意→退回，
     可指定退回节点。新客户默认无需审批直接给客服。
  3. **承运商（顺丰）客服处理**
     · **自动类**工单（转寄、退回、再派、改自取、改派送、
       改收件联系方式）→ 系统自动下发大网，成功后自动更新状态；
       下发失败转人工。
     · **人工类**工单（理赔、查签收、查破损等）→
       客服选「处理中」跟进，完成后选「已处理」关闭。
  4. **品牌方查看 / 重开**
     看处理记录；不满意可「重开工单」让客服继续跟。

  【待揽收场景】
  运单还没揽收时可「等待队列」，揽收后自动下发；
  等待 48 小时，超时未揽收自动转人工。急件别等，直接选其他类型。

  【已建过同类型工单】会弹同类型工单校验，避免重复建单。
