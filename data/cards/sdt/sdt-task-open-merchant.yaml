card_id: sdt-task-open-merchant
type: task
title: 怎么给客户开通顺店通商户？新增商户要填哪些必填项？
one_liner: 运营平台 → 商户管理 → 新增商户，必填来源类型、来源单号、客户手机号、月结账号、推荐人。
body: |
  【这一步是谁做】
  售前收集资料、运营交付人员在**顺店通运营平台**创建商户，
  不是客户自己操作。先要有运营平台账号和「商户管理」菜单权限。

  【入口】运营平台 → 商户管理 → 新增商户

  【必填信息（缺一项都提交不了）】
  · 来源类型：线上订单 / 线下合同，二选一
  · 来源单号：线上填数字商店订单号，线下填合同号（同类型唯一）
  · 客户手机号：11 位、1 开头，**不接受固话**
  · 月结账号：客户的月结卡号
  · 推荐人工号 + 推荐人姓名：都要填
  · 订阅版本 / 周期 / 成交价
  · 大区 / 业务区（决定运营监控的数据权限范围）

  【登录账号规则】
  · 账号：6–20 字符，不能纯数字，可纯字母或字母+数字
  · 密码：8–16 位，必须同时含大写、小写、数字、特殊符号
  · 可点【自动生成密码】生成合规密码，再【复制账密】交付客户

  【交付后】把账号初始密码通过安全渠道发给客户，
  提醒客户首次登录后改密码；并在商户列表按来源单号复查一遍录入是否正确。

  【说明】订阅有效期、来源单号这些建好后多数不可改，
  提交前务必和订单/合同原文核对。
