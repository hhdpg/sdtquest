card_id: sdt-api-config-where
type: rule
title: 对接开放接口的配置都在哪配？配错了会报什么错？
one_liner: 分三处：接口凭证、组织顺丰凭证、各类推送配置，缺一处都会静默失败。
body: |
  【第一处：接口凭证】
  · 应用 ID + 验签密钥
  · 由顺丰商务线下分配
  · 决定你的签名能不能通过

  配错了报「appId 非法」或「非法请求」。

  【第二处：组织顺丰凭证（最容易漏）】
  · 顾客编码 + 校验码
  · 组织维度的配置，跟账号无关
  · 绝大多数下单、查询、取消接口都要用

  没配报「顾客编码,效验码没有配置」。
  **这一处漏了，接口签名能过，但业务全部失败。**

  【第三处：各类推送配置】
  推送是分类型的，每类单独配：
  · 路由推送：每个组织配推送地址、应用 ID、密钥、产品标识、推送方式
  · 清单运费推送：每个组织配推送地址、密钥、启用状态
  · 店铺经纬度推送：走白名单 + 地址映射，不走组织配置
  · 国补推送：每个组织配接收地址 + 解密密钥

  **推送配置的特点是：没配就不推，而且不报错。**
  所以「为什么我没收到」十有八九是这一处。

  【怎么定位是哪一处】
  按报错类型分：
  · 顶层报签名/参数错 → 第一处
  · 顶层能过但业务报顾客编码 → 第二处
  · 接口都正常但收不到推送 → 第三处

  【给客户的建议】
  联调时按这个顺序逐项确认，不要一次性全开。
  第一处不通，后面都测不了。
