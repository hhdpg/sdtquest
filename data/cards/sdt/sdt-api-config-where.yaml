card_id: sdt-api-config-where
type: rule
title: 对接开放接口的配置都在哪配？配错了会报什么错？
one_liner: 分三处：接口凭证、组织顺丰凭证、各类推送配置，缺一处都会静默失败。
body: |
  【第一处：接口凭证】
  · 应用 ID + 验签密钥
  · 由顺丰商务线下分配，配在开放配置表
  · 决定你的签名能不能通过

  配错了报「appId 非法」或「非法请求」。

  【第二处：组织顺丰凭证（最容易漏）】
  · 顾客编码 + 校验码
  · 组织维度的配置，跟账号无关
  · 绝大多数下单、查询、取消接口都要用

  没配报「顾客编码,效验码没有配置」。
  **这一处漏了，签名能过，但业务全部失败。**

  【第三处：各类推送配置】
  推送分类型单独配，互不影响：
  · 路由推送：存数据库配置表，按组织配五样
  · 清单运费推送：存数据库配置表，按组织配三样
  · 店铺经纬度推送：走应用配置白名单 + 地址映射
  · 国补推送：按组织配接收地址 + 解密密钥

  **特点是没配就不推，而且不报错。**
  所以「为什么我没收到」十有八九是这一处。

  【还有几个能力开关】
  配在应用配置里，不配就是没开通：
  · 地址解析：需要你的应用 ID 在白名单里
  · 下单幂等：需要组织在幂等白名单里
  · 箱号全局校验：有独立开关控制

  【怎么定位是哪一处】
  按报错类型分：
  · 报签名/参数错 → 第一处
  · 签名过但报顾客编码 → 第二处
  · 接口正常但收不到推送 → 第三处
