card_id: sdt-rule-role-permission
type: rule
title: 角色和权限怎么配？为什么员工登录后按钮点不了？
one_liner: 系统管理 → 角色管理新增角色并勾选功能权限，再把角色关联到账号；没配权限的员工看不到对应按钮。
body: |
  【权限是怎么起作用的】
  顺店通是**角色授权**：先建角色，给角色勾权限，
  再把账号关联到这个角色，员工就拥有该角色的权限。
  员工点不了某个按钮 / 看不到某个菜单，基本就是角色没勾这项权限。

  【新增角色并配权限】
  入口：系统管理 → 角色管理 → 新增角色
  1. 输入角色名称
  2. 在「配置功能权限」里按需勾选：
     系统管理、小程序用户、业务配置、后台业务模块、
     订单管理、地址管理、结算管理、数据中心等
  3. 点【保存】

  【查看 / 改权限】
  · 查角色：按角色名称、创建部门查询
  · 点【查看关联账号】看这个角色下有哪些员工
  · 点【配置权限】可修改已建角色的权限

  【典型场景：下不了单说没权限】
  → 该账号的角色没勾下单相关权限。
     让管理员到 角色管理 → 配置权限 补上。

  【说明】你们组织实际分了哪些角色、各勾了什么权限，
  以角色管理页面的实际配置为准，我不能替你查。
