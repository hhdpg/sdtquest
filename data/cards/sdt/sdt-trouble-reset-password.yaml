card_id: sdt-trouble-reset-password
type: trouble
title: 忘记密码登不上了怎么办？怎么改密码？
one_liner: 找商户管理员在「系统管理 → 用户管理 → 修改密码」里重置你的账号。
body: |
  【现象】忘记密码，无法登录顺店通。

  【处理步骤】
  1. 找商户管理员登录 PC 后台
  2. 进入【系统管理】→【用户管理】
  3. 找到你的员工账号，点【修改密码】
  4. 设置新密码后，用新密码登录

  【说明】员工不能自己重置密码，必须由有用户管理权限的管理员操作。
  【如果管理员也登不上】联系顺店通的实施人员或客服协助处理。
