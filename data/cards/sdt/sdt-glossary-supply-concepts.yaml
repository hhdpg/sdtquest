card_id: sdt-glossary-supply-concepts
type: glossary
title: 要货单、发货单、补货建议、需求单有什么区别？分别用在哪？
one_liner: 要货单=门店向仓要货；发货单=收单码订单；补货建议=按库存算的建议量；需求单=到齐派凑单发运。
body: |
  【四个容易混的概念】

  · **要货单**：门店缺货，向仓库要货的单据。
    会自动同步 WMS 打包发货，运单号回传。
    入口：订单中心 → 要货单列表

  · **发货单**：收单码/小程序收来的商品订单，
    在收单中心确认接单后才形成运单。
    入口：收单中心 → 发货单管理

  · **补货建议**：系统按库存和销量算出的建议补货量。
    **它不会自动生成要货单**，要人工转换，
    别把两者当成一回事。

  · **需求单**：到齐派场景专用——多地发往同一地址，
    凑齐后统一派送。入口：需求管理（到齐派）

  【怎么区分】
  · 缺货要从仓拿货 → 要货单
  · 顾客在小程序买 → 发货单
  · 想知道该补多少 → 补货建议
  · 多地凑一起发 → 需求单

  【说明】各单据的完整状态流程见对应流程卡。
