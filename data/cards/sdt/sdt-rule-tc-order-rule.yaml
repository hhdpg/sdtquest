card_id: sdt-rule-tc-order-rule
type: rule
title: 同城急送下单规则怎么配？要填哪些必设项？
one_liner: 业务配置 → 下单选项 → 添加下单规则 → 同城急送下单，先关联组织，再设置寄件字段（带*为必设）。
body: |
  【入口】业务配置 → 下单选项 → 添加下单规则 → 同城急送下单
  需用客户一级组织管理员账号操作。

  【两步配置】
  第一步：关联组织
  添加需要下同城急送服务的组织。

  第二步：设置寄件人字段
  设置寄件人需要填写的字段信息。
  · **带 * 字段为必设置项**
  · 下单页面特殊设置（非必选）用于特殊管控场景，
    例如：锁定寄件姓名电话、过滤寄件人可搜索到的组织信息

  【完成标志】同城急送服务 + 下单选项都配好后，即可让客户下单。

  【补充】下单规则本身数量不限，但每个组织只能用一条（见「下单规则有什么限制」卡）。
