title: 运单审批怎么操作？审核、驳回后运单去哪了？在哪查审批进度？
one_liner: 运单管理 → 运单审批，勾选后点审核进「已审核」池、点驳回进「已驳回」池；进度在审批进度查询看。
body: |
  【入口】运单管理 → 运单审批

  【怎么审】
  1. 填查询条件 → 点【查询】查出待审核运单
  2. 勾选要处理的运单
  3. 点【审核】→ 运单进入**已审核**运单池
     点【驳回】→ 运单进入**已驳回**运单池

  【支持导出】
  点【导出】可把查询结果导出来。

  【在哪查审批进度】
  运单管理 → **审批进度查询**：
  填条件查询后，「审核状态」列显示进度；
  如果是**已驳回**，订单最右侧会显示**驳回原因**。
  同样支持导出。

  【和小程序端的区别】
  小程序「订单审批/审批查询」是给下单人自己审的，
  权限和入口不同，但底层是同一套审批状态。

  【说明】哪些运单会进审批、自动驳回规则是什么，
  见「订单审批流程」卡。
