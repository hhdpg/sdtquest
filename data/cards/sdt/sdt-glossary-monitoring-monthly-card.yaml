title: 智能监控的「月结卡号维护」是什么？和下单用的月结有什么区别？
one_liner: 月结卡号维护是把顺丰月结拉过来的运单纳入监控，用于没法强管控下单渠道的门店。
body: |
  【它解决什么问题】
  有的门店不走顺店通下单（用顺丰 App、小程序、接口等别的渠道发件），
  系统里看不到这些运单。但客户又想统一监控——
  就把这些运单用的**顺丰月结卡号**维护进来，
  系统按卡号把顺丰的运单**拉取**过来做监控。

  【和下单月结的区别】
  · 下单用的月结（顺丰月结设置 → 月结账号管理）：
    是「用哪张卡发件、怎么验证、怎么挂账」
  · 监控用的月结（智能监控 → 月结卡号维护）：
    是「按哪张卡拉取运单来监控」，不含发件

  【入口】智能监控 → 月结卡号维护

  【要做什么】
  · **月结卡号验证**：验证卡号有效性
  · **停用 / 启用**：某张卡暂不拉了就停用
  · **查询 / 删除**：按条件查、不用了删除

  【典型适用场景】
  没法对门店下单渠道强管控、又要统一数据管控的客户。
  拉过来的运单在「智能监控数据」里查看，部分敏感信息密文显示。

  【说明】能拉哪些卡、拉多久的数据，以实际配置和权限为准，
  我不能替你查。
