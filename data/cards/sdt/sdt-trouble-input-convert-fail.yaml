card_id: sdt-trouble-input-convert-fail
type: trouble
title: 下单报错「请求入参对象转换失败」怎么办？
one_liner: 收寄件地址里带了系统不认识的字符。删掉特殊字符、手动重输地址再下单。
body: |
  【报错原文】下单时报「请求入参对象转换失败」。

  【原因】收寄件人地址里有**特殊字符**（系统无法识别的符号/不可见字符），
  导致参数转换失败。

  【怎么处理】
  1. 把收寄件地址删除后**手动重新输入**一遍
  2. 确认没有多余的空格、制表符、特殊符号（如 ©、emoji、全角怪异符号）
  3. 重新提交下单

  【同类：批量导入也报这个】
  批量导入模板里地址列如果从别处复制粘贴带了隐藏字符，
  同样会失败。把该列清空重填成纯文本即可。

  【提示】这属于数据格式问题，不是权限或配置问题，
  不用去动下单选项。
