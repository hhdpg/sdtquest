title: 库存怎么管理？库存查询怎么看？
one_liner: 库存中心 → 库存查询，数据来自 WMS 系统同步或标准接口；可手动刷新主动查 WMS。
body: |
  【入口】库存中心 → 库存查询

  【库存数据从哪来】
  · 由 **WMS 系统同步**过来
  · 或通过**标准接口**同步到顺店通
  顺店通本身不产生库存，是展示/同步 WMS 的库存。

  【怎么刷新】
  点【手动刷新库存】，即主动去查一次 WMS 里的库存数量。
  平时看的是上次同步的数据，需要最新数就手动刷新。

  【前提：对接 WMS】
  基础配置 → WMS 对接设置 → 开通外部 WMS，
  选择已对接顺店通的 WMS（目前支持百川）。
  没对接 WMS 的，库存查询里没有数据。

  【和要货补货的关系】
  库存查询是「看库存」；要货补货（旗舰版）是「按库存生成补货建议」。
  两件事，别混。

  【说明】能查到哪些仓库/商品的库存，取决于 WMS 同步范围和你的权限，
  以页面实际显示为准，我不能替你查。
