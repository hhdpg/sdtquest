card_id: sdt-api-address-identify
type: rule
title: 地址解析接口为什么总报「地址填写不规范」？
one_liner: 有三道闸和按条计数的限流，解析失败不报错只回显原地址。
body: |
  【三道闸，任一不过都拿不到解析结果】

  **闸一：应用 ID 白名单**
  你的应用 ID 必须在 GIS 白名单里，否则直接报「此应用不允许访问」。
  这是要单独申请的，不是开通接口就自动有。

  **闸二：单次条数上限**
  一次最多传 50 个地址，超过直接拒。

  **闸三：限流（最容易踩）**
  · 每秒 200 次
  · 每天 50 万次
  · **按条计数，不是按次计数！**

  也就是说：你一次传 50 条地址，会扣掉 50 次配额。
  不是「调了一次接口扣一次」。

  所以批量解析时，配额消耗比你想象得快得多。

  【解析失败时不抛错】
  这是最关键的一点：
  当地址解析服务出问题时，接口**不报错**，
  而是返回一个「地址填写不规范，请重新正确填写！」的提示，
  同时把你传的原地址返回。

  所以你看到这条提示时，可能是：
  · 地址真的不规范（真的解析不了）
  · 或者解析服务临时出问题（其实地址没问题）

  判断方法：隔一段时间重试同样的地址。
  如果一直是同一条提示，说明地址真的有问题。
  如果偶尔能成功，那就是服务侧波动。

  【使用建议】
  · 不要在前端做实时逐字符解析，配额扛不住
  · 批量场景控制批次大小，比如一次 10 条而不是 50 条
  · 解析结果建议本地缓存，同一个地址不重复解析

  【为什么要用】
  把用户输入的文本地址解析成标准省市区 + 详细地址，提升下单成功率。
