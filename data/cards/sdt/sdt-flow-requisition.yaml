card_id: sdt-flow-requisition
type: flow
title: 门店要货单怎么走？要货、接单、发货、超时自动拒单是怎样的？
one_liner: 门店发要货单 → 待分配找仓 → 待接单 → 仓已接单发货 → 收货完成；门店超时未接单会自动拒单。
body: |
  【要货单状态流程】
  待分配 → 待接单 → 已接单待发货 → 已发货待收货 → 已完成
  另有：要货失败、已取消、超时关闭。

  【各环节在做什么】
  1. **门店新建要货单**
     前提：店铺收件地址和电话要填全，否则提示
     「当前店铺收件地址（电话、地址）不全」
  2. **系统找仓（待分配）**
     按寻仓策略分配仓库；无可用库存 → 「无可用库存，要货失败！」
     没有匹配策略 → 保持「待分配」
  3. **仓库接单 → 发货**
     仓库确认接单后转「已接单待发货」，发货后转「已发货待收货」
  4. **门店收货完成**

  【超时自动拒单】
  · 只针对「门店要货」且状态为**待接单**的单
  · 超过配置小时数没人接单，自动关闭：
    要货单置「超时关闭」，发货侧记「超时未处理-自动拒单」
  · 超时时长按组织配置，多标签时取**最短**
  · 关闭按钮和超时策略需开通对应服务

  【补货建议与要货单是两条线】
  补货建议（按库存/销量算建议量）走补货单链路，
  不会自动生成要货单，别把两者当成一件事。

  【说明】具体超时时长、寻仓策略，以你们组织配置为准，
  我不能替你查。
