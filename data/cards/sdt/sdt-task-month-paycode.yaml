title: 月结付款码怎么用？到付件怎么挂月结？
one_liner: 到付件想挂月结：在月结付款码页生成动态码给小哥扫，付完在「月结付款码查询」里能查到运单。
body: |
  【它是干什么的】
  客户退回的件是**到付**，但又想挂到自己的月结卡上付费时，
  出示一个「月结付款码」让顺丰小哥扫，就能把这笔到付记到月结。

  【在哪生成】
  · PC 端和小程序都能生成，走同一套出码接口
  · 出码时系统按组织的月结卡号规则取卡
    （按组织挂账取第一张；没有就按成本类型名匹配）
  · 生成的是**动态码/唯一付款码**

  【怎么查用过的码】
  运单管理 → 月结付款码查询
  可看到「付款码（唯一）」以及对应的运单。
  列表里运单号会延迟回写（系统异步回写明细）。

  【到付固定规则】
  通过付款码下的到付单，系统固定为到付、成本类型为「到付」，
  不需要人工填。

  【小哥扫码报「支付失败」】
  通常是扫码入口有问题，不是月结本身，按《月结付款码使用介绍》处理。

  【说明】能出码用哪张月结卡，取决于你们组织的月结挂账配置，
  以实际出码结果为准，我不能替你查具体卡号。
