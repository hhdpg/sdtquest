card_id: sdt-api-fee-push-config
type: rule
title: 清单运费推送要配什么？为什么有的客户能收到我们收不到？
one_liner: 按一级组织配：接收地址、密钥、启用状态，三样齐全才推。
body: |
  【按一级组织配置】
  运费推送不是全局开关，是**逐个一级组织**配置的。
  所以「别家能收到我们不能」很常见——就是没给你配。

  【三样必须齐全】

  **1. 接收地址**
  你的 URL。没配不推。

  **2. 密钥**
  用于生成推送签名。你那边要用同一个值验签。

  **3. 启用状态**
  必须显式启用。配了地址但没启用，一样不推。

  **任意一项缺失都不推，而且不会报错**，只是静默跳过。

  【推送的应用 ID 用什么】
  用的是**你的一级组织 ID**，不是另一个接口应用 ID。
  所以验签时要用组织 ID 作为应用 ID。

  【和「订单组织」的关系】
  推送是按订单找到所属一级组织，再用该组织的配置推。
  如果订单下在了 A 组织、但配置配在 B 组织，就推不出去。

  所以多组织的客户一定要确认订单实际归属哪个组织。

  【日志怎么查】
  系统有两级：一级消费把顺丰数据落库，二级消费真正推给你。
  一级有记录、二级没有 → 配置问题；一级也没有 → 顺丰侧还没推数据过来。

  【推了但你没收到】
  检查点从上游到下游：
  配置 → 签名 → 你的地址可达 → 你的响应是 200。
  400 会被判定为业务拒绝，不再重试。

  【和路由推送的区别】
  路由推送配的是五样（地址、应用 ID、密钥、产品标识、推送方式）；
  运费推送只配三样（地址、密钥、启用）。
  两种配置是分开的，不要混。
