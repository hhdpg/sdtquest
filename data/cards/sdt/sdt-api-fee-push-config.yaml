card_id: sdt-api-fee-push-config
type: rule
title: 清单运费推送要配什么？为什么有的客户能收到我们收不到？
one_liner: 数据库里按一级组织配三样：接收地址、密钥、启用状态，缺一就不推。
body: |
  【按一级组织配置，一个组织一行】
  运费推送不是全局开关，是逐个一级组织配的。
  所以「别家能收到我们不能」很常见——就是没给你配。

  **配置存在数据库表里，不在应用配置里。**

  【三样必须齐全】

  **1. 接收地址**
  你的 URL。空着不推。

  **2. 密钥**
  用于生成推送签名，你那边要用同一个值验签。

  **3. 启用状态**
  必须显式启用。配了地址但停用，一样不推。

  **任意一项缺失都不推，且不报错**，只打一行「组织未配置或已停用」。

  【应用 ID 用什么】
  用的是**你的一级组织 ID**，不是另一个接口应用 ID。
  验签时用它作为应用 ID。

  【和订单组织的关系】
  推送按订单找到所属一级组织，再用该组织的配置推。
  订单下在 A 组织、配置配在 B 组织，就推不出去。

  【日志怎么查】
  系统两级：一级消费把顺丰数据落库，二级消费真正推给你。
  一级有记录、二级没有 → 配置问题；一级也没有 → 顺丰侧还没推数据。

  【推了但你没收到】
  从上游到下游逐个检查：
  配置 → 签名 → 地址可达 → 你的响应是 200。
  返回 400 会被判为业务拒绝，不再重试。

  【一个遗留项要注意】
  应用配置里可能还留着早期的单客户推送参数，
  那是硬编码时代的历史配置，**代码已经不读了**。
  现在只看数据库表。别对着旧配置排查。
