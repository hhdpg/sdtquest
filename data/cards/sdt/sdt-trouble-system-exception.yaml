card_id: sdt-trouble-system-exception
type: trouble
title: 下单提示「系统异常，请联系管理员」怎么办？
one_liner: 多半是某个服务请求超时（最常见是智能识别地址），稍等重试、手填地址即可。
body: |
  【报错原文】下单时提示「系统异常，请联系管理员」。

  【原因】一般是下单过程中某个服务请求超时。
  最常见的是「智能识别地址」调用超时——地址识别不出来或太慢。

  【怎么处理】
  1. 先等一下重新提交一次，多数是偶发超时
  2. 如果反复出现，**手动输入收寄件地址**，不要用智能识别
  3. 仍不行，把运单号/操作时间/截图给管理员，由技术人员排查

  【和「下单失败」区分】
  · 「系统异常，请联系管理员」= 服务超时，通常与技术侧有关
  · 只提示「下单失败」没有其他说明 = 多半是收件地址超范围
    或流向管控，去顺丰官网查收派范围

  【注意】不要把「系统异常」当成地址填错反复改，
  先换手动填地址重试，能解决大多数情况。
