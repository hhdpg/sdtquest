card_id: sdt-rule-data-security
type: rule
title: 数据安全怎么配？为什么有的运单信息脱敏了、有的没有？
one_liner: 数据安全怎么配：业务配置 → 数据安全开脱敏开关设范围；打印脱敏要用普通员工账号，管理员账号不生效。
body: |
  【入口】业务配置 → 数据安全
  这里控制脱敏和各类查询权限。

  【敏感数据脱敏设置】
  · 需要加密的字段，打开右侧对应开关即可
  · **数据加密对管理员账号不生效**
  · 面单加密按云打印规则执行

  【为什么有的脱敏有的没脱敏】
  · 打印面单的脱敏，要用**普通员工账号**打印才生效
  · 用管理员账号打印不会脱敏
  · 要求小哥打印面单也脱敏：
    业务配置 → 下单选项 → 普通快递服务填写设置 → 隐址件 → 选「默认使用」

  【各类查询权限（都在这个页面设）】
  · 移动端订单查询权限：只能看自己的 / 看本组织全部
  · PC 订单查询权限：只能看自己的 / 看本组织全部
  · 收件地址簿 / 寄件地址簿查询权限：
    只能看自己加的 / 看本组织全部 / 看全公司全部
  · PC 订单对账查询权限：仅一级管理员可看 / 看本组织的
  · PC 端智能监控工单查询权限：
    只能看自己建的 / 看本组织及下级建的（一级管理员不受限）

  【说明】具体每个开关你们组织开没开，
  以数据安全页面实际显示为准，我不能替你查。
