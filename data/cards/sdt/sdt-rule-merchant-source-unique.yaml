card_id: sdt-rule-merchant-source-unique
type: rule
title: 开通商户时提示「来源单号已存在」怎么办？
one_liner: 同一来源单号只能绑一个商户。先去列表按单号查，已存在就别重复开通。
body: |
  【报错原文】提交新增商户时提示「该来源单号已存在」。

  【规则本体】
  来源单号（线上订单号 / 线下合同号）在**同类型下唯一**，
  已经被绑定过商户的单号不能再用来开新商户。

  【处理步骤】
  1. 商户管理列表 → 用「来源单号」查这个单号
  2. 查到了：说明该订单/合同已开通过商户，
     联系客户确认是不是重复下单或信息填错，**不要重复开**
  3. 查不到但一直报错：
     核对单号有没有多余空格、错别字，确认无误后找系统管理员排查

  【改来源单号注意】
  编辑商户时来源单号和来源类型可以改，
  但改完仍受唯一性校验；这等于变更商户与订单/合同的绑定关系，
  改之前要和客户、销售确认清楚。

  【确实拿不到单号怎么办】
  线上订单缺失：去数字商店管理端查订单再创建。
  合同号缺失：以合同文件编号为准，合同没生成就等签完再录。
  实在无法获取（如免费开通不走数字商店的），
  可与业务负责人确认后用字母数字组合占位，但随机组合系统也会校验唯一。

  【说明】一单对应一商户是强约束，
  对账、续费追溯都靠来源单号，别图省事重复绑。
