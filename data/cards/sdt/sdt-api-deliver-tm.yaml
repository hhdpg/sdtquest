card_id: sdt-api-deliver-tm
type: rule
title: 时效查询是怎么算的？运费是本地算还是顺丰算？
one_liner: 全调顺丰实时算，本地没有任何费率表，产品匹配不上会降级。
body: |
  【核心结论：本地不算】
  时效和运费的预期值**全部由顺丰实时计算返回**。
  本地没有费率表，也没有计费规则。

  所以「你们的费率表在哪」「为什么和账单对不上」这类问题：
  · 时效查询返回的是**预估**，不是最终账单
  · 最终费用以顺丰账单（清单运费推送）为准

  【计算流程】
  1. 先解析寄件和收件地址（调地址解析服务）
  2. 组装请求，把「要看价格」的标志打开
  3. 调顺丰时效接口
  4. 返回时效 + 预估运费 + 解析后的省市区

  【产品编码匹配有降级链（重要）】
  · 你传的产品编码**精确匹配成功** → 用它
  · 匹配不上 → **降级成标准快递**
  · 标准快递也没有 → 取返回的第一条
  · 你压根不传 → 直接取第一条

  所以「我传了特惠为什么返回标快」—— 大概率是特惠匹配不上被降级了。

  【时间入参】
  不传寄件时间就按当前时间算。
  传了要按标准格式（年-月-日 时:分:秒）。

  【结果为空不是报错】
  顺丰返回空数据时，接口会返回成功 + 空结果。
  这种情况按「这个地址这条线路查不到时效」处理，
  不要当成接口故障去重试。

  【前置条件】
  组织必须配好顾客编码和校验码，没配直接报参数异常。

  【容易混淆的点】
  另有一个「清单运费查询」接口，那个查的是**已产生运单的实际费用**。
  时效查询查的是「还没下单时预估多久、多少钱」。两个不是一回事。
