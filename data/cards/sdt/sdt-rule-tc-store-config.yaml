card_id: sdt-rule-tc-store-config
type: rule
title: 同城急送店铺ID怎么配？怎么判断配好了？
one_liner: 批量导入店铺ID和经纬度 → 开通所有已覆盖 → 批量开通服务；只有同时显示「已覆盖+已开通」才算配好。
body: |
  【入口】业务配置 → 同城急送服务（用客户一级组织管理员账号登录）

  【三步配置】
  1. 批量导入店铺 ID 和经纬度
  2. 开通所有已覆盖
  3. 批量开通服务

  【怎么判断配好了 —— 关键】
  页面上要**同时显示「已覆盖」和「已开通」**才算配置完成。
  · 服务已开通但未覆盖 = **配置未完成**

  【前置：拿店铺ID】
  先找同城销售获取店铺 ID 及经纬度。
  提醒销售：创建店铺 ID 时**务必勾选「返回运单号」**，
  否则同城不会把运单号回传给顺店通客户。

  【其他】
  · 已导入的店铺可单条操作
  · 组织还没建的，先到 系统管理 → 组织管理 → 新增组织或批量导入
anchors: [配置店铺ID, 店铺ID, 经纬度, 已覆盖, 已开通, 配置未完成, 返回运单号, 批量开通服务]
