card_id: sdt-api-config-exclusive
type: rule
title: 哪些客户开了接口能力？怎么查某个组织有没有开通？
one_liner: 幂等和地址解析靠应用配置白名单，推送靠数据库表或地址映射，都要单独申请。
body: |
  【四类能力，三种存放位置】

  **1. 下单幂等（应用配置白名单）**
  只有名单里的组织才有按客户订单号幂等的能力，不在名单里重复提交一定重复下单。
  名单是逗号分隔的组织 ID 列表，改完需刷新配置才生效。

  **2. 地址解析（应用配置白名单）**
  同样组织 ID 列表，不在名单直接报「此应用不允许访问」。

  **3. 推送类（数据库表 / 地址映射）**
  · 路由：每个组织一行，含地址、密钥、产品标识、推送方式
  · 运费：每个组织一行，含地址、密钥、启用状态
  · 店铺：应用配置里的「组织 → 接收地址」映射

  **4. 箱号唯一性校验（应用配置开关）** 总开关按组织控制，另有天数窗口。

  【排查入口】拿到客户的**一级组织 ID** 后逐项确认：
  白名单类查应用配置，推送类查数据库表有无记录、是否启用。

  【两个容易搞错的点】

  **推送配置里配了不等于生效。** 状态字段不是启用就等同于没配，且不报错。

  **配置表里的应用 ID 应当等于组织 ID。** 两者不一致的数据是错的，
  推送时会拿那个错误值去查密钥，查不到就推送失败。
  排查推送问题时要顺手比对这两个字段。

  【标准答复】先问「你的组织 ID 是多少」，再按上面四类逐项确认。
  白名单类改完有缓存刷新周期，刚开通就测可能还是老状态。
