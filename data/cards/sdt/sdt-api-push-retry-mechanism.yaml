card_id: sdt-api-push-retry-mechanism
type: rule
title: 推送失败会自动重试几次？隔多久重推？
one_liner: 先同步重试 3 次间隔半秒，还失败就落重试表，隔天最多再推 3 次。
body: |
  【两个阶段】

  **阶段一：同步重试**
  连续尝试 **3 次**，每次间隔 **500 毫秒**；
  单次调用的连接超时和读取超时都是 **5 秒**。

  所以对方接口 6 秒才响应的话，三次都会超时判失败。
  **对方接口必须在 5 秒内响应**，这是硬要求。

  **阶段二：落表重推**
  3 次都失败后写进重试表，隔天由定时任务扫描重推，每条最多 3 次，超了就不管，需人工介入。

  重推前会**重新生成请求 ID、时间戳、签名**——原来的时间戳早过期了。
  所以对方验签逻辑必须接受新签名值，不能缓存第一次的签名来比对。

  【成功和失败怎么判定】
  · 成功码 200 → 成功，停止重试
  · 成功码 400 → **业务拒绝，不重试**，只记错误日志
  · 其他 → 失败，继续重试

  400 表示「对方明确不接受这条数据」，重试再多遍也不会成功，所以直接放弃并告警。

  【两类推送的编号规则不同】
  · 清单运费推送：重试标识是**订单 ID**，同一个单合并刷新
  · 店铺经纬度推送：重试标识是**一级组织 ID**，逐条插入不合并

  所以店铺推送的重试表可能有多条同组织记录，运费推送同一个订单只会有一条。

  【日志怎么查】
  每类推送有各自的日志前缀，按前缀加请求 ID 检索：
  店铺推送按组织编码搜，运费推送按订单号搜。
