card_id: sdt-api-route-push
type: rule
title: 路由推送推的是什么？为什么我一条都没收到？
one_liner: 推标准状态码不是顺丰原始码，没配置推送地址就一条都不推。
body: |
  【先确认你接的是哪个推送】

  系统里有两类推送，**很多人以为是同一个**：

  **1. 路由推送**
  推物流节点：受理、运输、派送、签收。
  状态用的是**标准状态码**，不是顺丰原始操作码。

  **2. 运单信息推送**
  推重量、体积、揽收时间、签收时间。
  和路由推送是**完全不同的两个导出通道**。

  如果你要的是「这单走到哪了」，接的是路由推送。
  如果你要的是「这单多重、什么时候签收的」，接的是运单信息推送。
  接错了就会觉得「推了但内容不对」。

  【标准状态码对照】
  · 未收件
  · 已收件
  · 运输中
  · 派件中
  · 已签收
  · 异常件
  · 已取消

  **注意：推给你的是这七种标准码，不是顺丰的原始操作码。**
  所以「为什么推的状态和顺丰官网不一样」—— 是设计如此。

  【一条都没收到，按顺序排查】
  1. **推送地址配了吗** —— 没给这个组织配地址，一条都不会推（最常见）
  2. **组织对得上吗** —— 推送按运单找到所属组织，再用该组织配置推
  3. **签名校验过了吗** —— 报文带签名头，用的是你配置的密钥
  4. **你的接口返回 200 了吗** —— 非 200 会被判为失败

  【加密推送】
  有一种推送方式会把报文内容用你方公钥加密，收到后要用私钥解密。
  配置是加密模式却按明文解析，会看到一堆乱码，别误判成接口坏了。
