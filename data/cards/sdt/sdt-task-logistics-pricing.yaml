title: 物流计价规则怎么配？计价对账和运单运费流水是干什么的？
one_liner: 按流向配个性化计价规则，用来和顺丰算出的运费核对；目前只支持标快、特快、卡航三个产品。
body: |
  【这一组四个菜单的关系】
  都在「物流成本对账」下，是一条完整的核对链路：

  1. **物流公司账单**：导入顺丰财务出具的月结账单
  2. **运单运费流水**：确认 / 更新 / 作废 / 标记异常每笔账单
  3. **物流计价规则**：按流向配个性化计价规则
  4. **物流计价对账**：用你配的规则算一遍，和运单实际运费比对

  【物流计价规则怎么用】
  按**流向**设置个性化计价规则，系统按规则算出应收运费，
  再和顺丰给出的运费核对，看差在哪里。

  【只支持三个产品】
  · 顺丰标快
  · 顺丰特快
  · 顺丰卡航
  其他产品配不了计价规则。

  【计价对账做什么】
  展示「按你配的规则算出的运费」vs「运单查到的清单运费」，
  差异可**标记异常**，方便找出计费问题。

  【对账单】
  在【运单运费流水】点【生成汇总对账单】后，
  到【物流成本对账单】查看，支持导出。

  【说明】规则里的具体费率、流向口径属于业务定价，
  以你们实际配置为准，我不能替你查。
