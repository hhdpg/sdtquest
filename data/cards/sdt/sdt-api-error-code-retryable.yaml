card_id: sdt-api-error-code-retryable
type: trouble
title: 接口报错了该不该重试？哪些能重试哪些重试没用？
one_liner: 系统繁忙和超时可以重试，参数错误和业务规则拒绝重试也没用。
body: |
  【可以重试的（临时性故障）】
  · **系统繁忙** → 并发锁抢占或临时过载，等一会儿重试
  · **操作失败 / 系统异常** → 服务端临时故障
  · **网络超时** → 重试，但要重新生成时间戳和签名
  · **余额锁、单号锁抢占失败** → 并发保护，重试即可

  建议指数退避。

  【重试没用的（确定性失败）】
  参数异常、签名不通过、时间戳超时、appId 非法、顾客编码未配置、
  订单状态不允许、运单号不存在、箱号已被使用、月结卡号未验证。
  这些要么参数错了、要么配置问题，重试一百次结果一样。

  【最容易被忽略的一条】
  **时间戳超时不能原样重试。** 重试必须重新生成请求 ID、时间戳、签名三个值。
  只改时间戳不改签名，一样验签失败。

  【一个反直觉的情况】
  「参数异常」和「非法请求」是同一个错误码。先看文案：
  · 提到 empty / timestamp → 参数问题，重试无用
  · 只写「非法请求」或无具体描述 → 签名问题，重试无用

  【下单失败要不要重试】
  不要直接重试，可能是先落库后失败的，重试会产生第二张单。
  正确做法：先查订单状态，是「已导入」就先取消再重新下单。

  【推送失败的判定不一样】
  · 返回 200 → 成功
  · 返回 400 → 业务拒绝，系统不重试
  · 其他 → 失败，系统自动重试 3 次

  返回 400 表示「不接受这条数据」，系统不再推。
