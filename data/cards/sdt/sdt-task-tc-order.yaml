title: 同城急送怎么下单？寄件要填哪些信息？
one_liner: 微信搜「顺店通」小程序，选同城急送，逐个填收寄件人和物品信息，选成本类型后提交。
body: |
  【入口】微信搜【顺店通】小程序。
  网页版：https://united-store-ms.sf-laas.com/

  【必填项（9 项）】
  1. 收寄件人信息
  2. 选择【同城急送】
  3. 【成本类型】—— 决定收寄件地址能否自由填写
  4. 【物品总金额】
  5. 【物品类型】
  6. 【物品】
  7. 【预约送达时间】
  8. 【数量】【重量】
  9. 【独享转送】【配送工具】

  【选填项（4 项）】
  · 【POS/订单号】：没有可不填
  · 【代收货款】
  · 【自定义字段】
  · 其中【代收货款】【自定义字段】属增值服务，
    未在后台配置的话，寄件页面**不显示该字段**

  【关键提醒】
  【独享转送】被标为必填，但它同样是增值服务——
  如果后台没配置，页面可能不出现这个字段。
  配置了就必须选。

  【前置条件】同城急送服务必须已开通并配好店铺ID、下单规则。
