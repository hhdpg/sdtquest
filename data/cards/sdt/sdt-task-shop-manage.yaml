card_id: sdt-task-shop-manage
type: task
title: 店铺怎么创建？电子面单授权怎么配？店铺停用有什么影响？
one_liner: 店铺中心 → 店铺管理新增店铺，再配电子面单授权/配置；平台授权店铺不能禁用，停用不影响已存在订单。
body: |
  【店铺是干什么的】
  O2O 场景用：把电商平台店铺（淘宝/京东/小红书/抖音/
  拼多多/快手/视频号/有赞/唯品会等）接入，就近门店发货。

  【创建店铺】店铺中心 → 店铺管理 → 新增
  · 店铺名称不能重复，提示「店铺名称已存在」
  · 上游店铺编码、卖家主账号在**一级组织内唯一**
  · 平台选「视频号」时，平台店铺 ID 必填
  · 新建默认：未授权、启用中、手工来源

  【电子面单授权】
  店铺中心 → 电子面单授权
  · 店铺已删/停用会提示「该店铺不存在/未启用」
  · 电子面单类型要和平台授权关联店铺一致，否则报错
  · 再配电子面单配置（模板、生效门店）

  【停用与删除的区别】
  · **停用**：只把店铺置为停用，不联动已有订单，
    已存在的订单和发货单能正常流转
  · **平台授权的店铺不允许禁用**
  · **删除**才校验：店铺下有绑定的发货单就禁止删除，
    提示「该店铺下是存在绑定的发货单,禁止删除!」
  · 停用/删除仅一级组织可操作

  【说明】能接入哪些平台、授权怎么填，以店铺中心实际页面为准，
  我不能替你查。
