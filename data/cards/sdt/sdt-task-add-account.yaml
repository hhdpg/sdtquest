card_id: sdt-task-add-account
type: task
title: 怎么新增员工账号？怎么批量导入账号？
one_liner: 系统管理 → 用户管理 → 新增账号，填基本信息并勾选角色后保存；多人用「批量导入」。
body: |
  【入口】系统管理 → 用户管理

  【单个新增】
  1. 点【新增账号】
  2. 填写账号基本信息（带 * 为必填项）
  3. 在【关联角色】中勾选该账号要用的角色
  4. 点【保存】

  【批量导入】
  点【批量导入账号】，下载模板填写后上传。

  【关键点】角色决定这个账号能看到的菜单和能做的操作，
  所以新建账号前要先确认对应的角色已经建好并配好权限
  （角色配置见：系统管理 → 角色管理 → 配置权限）。

  【配套操作】
  · 查账号：用户管理 → 查询账号，可按条件筛选并导出
  · 改账号：进账号详情点【编辑】；多人改信息用【信息批量更新】
  · 停用：用户管理 → 禁用/批量禁用账号
  · 重置密码：用户管理 → 修改密码
