title: 收件地址簿、寄件地址簿怎么用？为什么看不到别人的地址？
one_liner: 地址管理里维护收件/寄件地址，下单可直接调用；能看到哪些地址取决于「数据安全」里的地址簿查询权限。
body: |
  【两个地址簿】
  · **收件地址簿**：存常用收件人，下单选收件人时直接调
  · **寄件地址簿**：存常用寄件地址，退货/异地代发时用

  【入口】地址管理 → 收件地址管理 / 寄件地址簿

  【能做什么】
  查询、查询结果导出、批量导入、编辑、删除/批量删除。
  批量导入同样用模板，格式错会报错。

  【为什么看不到别人的地址】
  取决于「业务配置 → 数据安全」里的地址簿查询权限，三档：
  · 仅可查看**此账号添加的**地址
  · 可查看**所属组织**添加的所有地址（默认）
  · 可查看**全公司**的所有地址

  【为什么地址显示不全/脱敏】
  地址簿列表**默认脱敏显示**（手机号等打码）。
  有权限看详情的才能看全，没权限点详情会提示「无该地址权限」。

  【说明】你们组织配的是哪一档权限，
  以数据安全页面实际显示为准，我不能替你查。
