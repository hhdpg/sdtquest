title: 订单对账怎么做？为什么我打不开订单对账？
one_liner: 仅一级组织管理员能看；财务 → 订单对账，导出账单、逐单对账、标记异常、付款。
body: |
  【谁能看】
  订单对账**只有一级组织管理员**（及被授予该权限的财务角色）能打开，
  普通用户看不到，也进不去。

  【入口】财务管理 → 订单对账

  【对账操作】
  1. **导出历史账单列表**：先导一份历史账单留存
  2. **对账**：点【对账】进入账单详情（待对账），
     按条件【查询】账单明细，可【查询结果导出】
  3. **标记异常**：选中异常单，点【批量标记异常】，
     选「批量标记为」+ 填「异常备注」→ 确定
  4. **付款**：对账无误后进入付款环节，可查看付款记录

  【账单来自哪】
  先在「账单设置」里新增月结协议（月结账号、账期设置、账单计算规则），
  系统按你设的折扣自动对账。

  【和「物流成本对账」区分】
  · 订单对账：和顺丰月结账单对，看每单运费对不对
  · 物流成本对账：导入物流公司账单、导入计价规则、形成对账单
  这是财务进阶层级，标准版不一定开通。

  【说明】能看哪些组织的数据取决于权限，
  以实际能看到的范围为准，我不能替你查。
