card_id: sdt-trouble-no-phone
type: trouble
title: 下单报错「没有当前用户电话号码信息」怎么办？
one_liner: 账号里没维护寄件电话。右上角头像 → 寄件信息，补上寄件电话再下单。
body: |
  【报错原文】下单时报「没有当前用户电话号码信息」。

  【原因】当前登录账号没有维护寄件人电话，
  系统取不到寄件电话就无法生成运单。

  【处理步骤】
  1. 点页面右上角头像
  2. 进【寄件信息】
  3. 维护好寄件电话（和寄件人姓名）
  4. 保存后重新下单

  【同类：小程序寄件信息不同步】
  PC 端改完寄件信息，小程序端没更新时：
  1. 在小程序端先手动填一次寄件姓名和电话
  2. 下一单，系统会自动保存这次的姓名电话
  3. 进地址簿把这对姓名电话设为默认值

  【提示】这是账号资料缺失，不是权限问题。
  给员工建账号时顺手把寄件电话一起维护好，能少走这步。
