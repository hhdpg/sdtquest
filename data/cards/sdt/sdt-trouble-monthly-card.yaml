title: 巴枪收件提示「月结卡号不可用」「付款方式错误」怎么办？
one_liner: 分三种：付款方式错就改「第三方付」；卡号注销/冻结找销售；接入码不匹配去补月结管控渠道。
body: |
  【按提示类型对号入座】

  ① 提示「付款方式错误」
  → 一般在第三方地区用了「寄付月结」。改成「第三方付」即可。

  ② 提示「月结卡号注销/冻结」
  → 月结卡状态有问题。联系你的销售确认月结状态。

  ③ 提示「接入码不匹配」
  → 是月结管控下单渠道导致的。
     查这个运单的顾客编码，看是否在月结管控渠道里；
     不在的话把它加进去即可。

  【另一情形】小哥扫月结付款码提示「支付失败」
  → 是扫码入口的问题，不是月结本身的问题，按《月结付款码使用介绍》操作。
