card_id: sdt-api-freight-budget-block
type: rule
title: 接口返回超预算标志是什么意思？
one_liner: 命中预算管控时按组织配置三种处理，其中一种是直接拒绝且不落库。
body: |
  【先确认会不会触发】
  两个条件同时满足才走预算管控：
  · 组织开通了「订单运费额度」服务
  · 本单付款方式或成本类型命中预算规则范围

  两个条件都不满足时预算规则完全不生效，接口行为和无预算时一样。

  【接口返回怎么区分三种结果】
  组织侧配了哪种处理方式（审批 / 转寄付现结 / 直接拒），
  从接口返回可以反推：

  **返回带超预算标志、且没有订单号**
  → 被直接拒绝，**这单不会落库**。
  重试没有意义，先让客户提额或走审批。

  **返回成功、但订单要等审批才能发**
  → 进了审批流，单已创建。
  此时取消要按正常取消接口走。

  **返回成功、但付款方式被改成了寄付现结**
  → 自动转寄付现结。
  客户如果对付款方式有强要求，要判断这不是原来的付款方式了。

  【额度不足的判定算法】
  可用额度 = 上限 − 已扣减 − 已占用。
  下单时用「可用额度 − 预估运费」判断是否超额。
  运单取消后占用的额度自动退回，所以取消后额度会回升。

  【每月刷新的影响】
  额度在每月最后一天晚上自动刷新、清零占用和扣减。
  所以月末被拒的单，次月 1 号重新提交可能就过了。
  接口侧不需要做特殊处理，但客户会问「为什么昨天不行今天行」，这是原因。

  【三种处理方式各自怎么配】
  属于业务配置侧的规则，见「运费预算怎么配」那张卡。
