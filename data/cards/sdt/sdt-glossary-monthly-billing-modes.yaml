card_id: sdt-glossary-monthly-billing-modes
type: glossary
title: 月结号是怎么挂的？按组织、按成本类型、按产品、自选有什么区别？
one_liner: 顺店通有 4 种挂账方式：按组织（默认）、按成本类型、按顺丰产品、下单人自选。
body: |
  【挂账方式一共 4 种】
  入口：业务配置 → 顺丰月结设置 → 月结账号规则配置
  同一时间启用其中一种。

  【A. 按组织挂（系统默认）】
  下单时取用户**所属组织**维护的月结账号发件。
  该组织没维护月结，就往上找上级组织，一直到根组织。
  优先级最高的是「**承担费用收件组织**」：
  规则里指定了承担费用的收件组织，且本单收件组织在其中，
  就直接用该收件组织的月结，不再看寄件方。
  调拨下单涉及三方（下单方、寄件方、收件方），
  可点【点击修改】指定这笔费用由哪方承担。

  【B. 按成本类型挂】不同成本类型对应不同月结账号。
  某个成本类型没设月结，就回落到根组织的月结。

  【C. 按顺丰产品挂】不同顺丰产品对应不同月结账号。
  没设的，回落到根组织的月结。

  【D. 下单人自选】配多个月结账号和别名，下单时让用户自己选。
  菜单里**只显示别名，不显示真实月结卡号**。

  【到付享月结折扣】另有一个「到付月结规则配置」，
  开启并维护月结卡号后，到付现结也能享寄方月结的折扣价。

  【说明】你们组织实际启用了哪种、挂了哪些卡，
  以「月结账号规则配置」页面的实际显示为准，我不能替你查。
