card_id: sdt-trouble-order-fail-no-reason
type: trouble
title: 下单只提示「下单失败」没有具体原因怎么办？
one_liner: 多半是收件地址超出派送范围或流向管控。去顺丰官网查收派范围确认。
body: |
  【现象】点下单后只提示「下单失败」，
  没有说明是哪个字段有问题。

  【原因（最常见两种）】
  1. **收件地址超出顺丰派送范围**——地址不在收派范围内
  2. **流向管控**——该流向被顺丰临时管控（如疫情、天气、地区限制）

  【怎么确认】
  · 去顺丰官网查该地址的收派范围，确认是否可达
  · 如果地址在范围内，可能是流向管控，换其他流向或改到附近可派送点

  【和其他报错区分】
  · 有具体字段名（如「缺少成本类型」）→ 按对应卡处理
  · 只说「下单失败」→ 基本就是地址范围 / 流向问题
  · 「系统异常，请联系管理员」→ 是服务超时，见对应卡

  【提示】这类不是配置问题，改下单选项没用，
  重点是核实收件地址能不能派送。
