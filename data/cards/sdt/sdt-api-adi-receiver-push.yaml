card_id: sdt-api-adi-receiver-push
type: rule
title: 阿迪收方信息推送怎么接？密文怎么解？
one_liner: 按订单号幂等不覆盖，电话和地址是 RSA 密文，超 245 字节要分段。
body: |
  【方向：顺店通调你的接口】
  阿迪有新销售单时，把收方信息推给你，不是你去查。

  【两个处理规则】

  **1. 按订单号幂等**
  同一个订单号重复推送，**直接返回成功、不覆盖原数据**。
  数据库层还有唯一约束兜底，所以你不用担心重复数据。

  **2. 电话和地址是密文**
  · 用你方**公钥**加密，传输格式是加密后的 Base64 密文
  · 你方用**私钥**解密后才能用

  【超过 245 字节必须分段（最易踩的坑）】
  RSA 2048 位单次能加密的明文上限是 **245 字节**。
  地址超过这个长度，发送方必须**分段加密**，接收时也要**分段解密再拼接**。

  要点：分块大小 **256 字节**（2048 位模长），每段单独解密，按顺序拼接。
  如果你的实现是一次性解密整段，超长地址就会解密失败。

  【报文包含什么】
  明文：订单号、收件人姓名、省、市、区、邮编、下单时间。
  密文：电话、详细地址。

  【幂等的边界】
  幂等只看订单号。订单内容真的变了（比如改过地址），重复推送也**不会更新**。

  【失败返回】
  · 验签失败、参数错误、时间戳超时、解密失败 → 400
  · 其他异常 → 500

  【密钥怎么配】
  你方把**公钥**给顺店通加密用，**私钥**自己保管解密用。
  私钥不能外传，否则等于把数据交出去了。
