title: 月结付款码查单怎么用？为什么只返回手机号后四位？
one_liner: 用月结码生成的编号查运单，最多返 1000 条，联系电话只给后四位。
body: |
  【两个入参要配套使用】
  · 月结码编号（生成月结码时返回的那个唯一标识）
  · 月结卡号

  两个必须从「月结码生成」接口配套拿到，不能自己拼。
  月结卡号在库里是加密存储的，你用明文传，系统会加密后比对。

  【返回什么】
  · 运单号
  · 联系电话（**只有手机号后四位**）

  为什么只给后四位：这是脱敏设计。
  后四位够客户做核对，又不构成完整隐私泄露。

  如果顺丰的运单安全接口取不到手机号，这个字段会是空的。
  所以「为什么联系人是空的」—— 不是 bug，
  是那单在顺丰侧没拿到安全信息。

  【一次最多 1000 条，没有分页】
  固定上限 1000 条，**没有分页参数**。
  如果一个月的运单超过 1000 条，只能拿到前 1000 条。

  【只查有效状态的单】
  只返回状态为「有效」的运单。
  已取消的运单不会出现在结果里。

  【前置条件】
  组织必须存在且没被禁用。
  组织被禁用了会直接报错。

  【典型使用场景】
  月结客户扫码验证身份后，查自己这张月结卡下有哪些运单。
  一般用于自提或对账场景。

  【和「清单运费查询」的区别】
  · 月结付款码查单：按月结卡 + 月结码查运单**列表**
  · 清单运费查询：按订单号/运单号查**单个运单的费用**
  一个是找单，一个是查钱。
