card_id: sdt-flow-quick-receipt
type: flow
title: 快速收单是什么？收单码怎么用？从扫码到出运单的流程是怎样的？
one_liner: 店员用自己的收单码让顾客扫码下单 → 生成待确认发货单 → 确认接单 → 发货出运单。
body: |
  【适用场景】
  门店做私域/社交电商：把商品链接或收单码发给顾客，
  顾客扫码填收货信息下单，门店确认后一键出顺丰运单。

  【收单码】
  · 每个员工有**自己的收单码**（含员工+组织信息）
  · 一员工一码；岗位/组织变了要重新下载码，
    否则下单会提示「用户所属组织已更新，请重新下载收单码下单」

  【完整流程】
  1. 顾客扫门店的收单码，在小程序里下单
  2. 系统生成一张**待确认**的发货单
  3. 店员在「收单中心 → 发货单管理」**确认接单**
  4. 发货时生成顺丰运单，回写发货状态
  5. 可在收单中心看收单商品、收单报表

  【常见卡点：收件信息不完善】
  同一张发货单下多个订单如果**收件组织 / 收件人 / 收件电话不一致**，
  这张单会被标记异常，无法下单，提示
  「存在【收件信息】不完善的发货单，请先补充收件信息后再获取运单」。
  先去补录收件信息再发货。

  【收单商品】先把商品维护进收单商品库，
  顾客才能在小程序里选品下单。

  【说明】收单码、商品、发货单都在收单中心管理，
  和普通下单是两条链路，但最后都汇到运单列表。
