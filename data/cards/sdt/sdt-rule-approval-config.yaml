card_id: sdt-rule-approval-config
type: rule
title: 怎么给下单设审批？审批规则有什么限制？
one_liner: 业务配置 → 审批规则设置 → 添加审批规则，审批项最多同时开 3 项；只有一级组织管理员能设。
body: |
  【配置入口】业务配置 → 审批规则设置 → 添加审批规则

  【怎么加】
  1. 点【添加审批规则】
  2. 填【规则名称】
  3. 按需勾选【审批项】—— **最多同时开启 3 项**
  4. 选【规则类型】：
     · 默认审批规则：对所有组织生效
     · 指定组织审批规则：必须点【添加组织】选具体组织
  5. 点【保存】

  【权限限制】**仅一级组织管理员**可以设置审批规则。

  【默认要不要审？】
  系统按「一级组织编码 + 下单类型（或成本类型）」匹配审批规则：
  · 匹配到规则 → 按规则审 / 不审
  · 组织存在但**没配规则** → 默认**不审**，直接下单
  · 连组织都查不到 → 默认**需要审批**
  所以「没配审批」通常就是不审，不是默认全审。

  【审批怎么走】
  审核通过后系统自动下运单。审批人在两处处理：
  · PC端：运单管理 → 审批进度查询
  · 小程序：我的 → 审批查询
  可做「审核通过」或「驳回」。

  【防超预算】设了需审核 + 审批时效后，
  长时间没人审的订单会被系统自动驳回（上限 168 小时/7 天）。
  审批时效内没处理，或取件时间已到，都会触发自动驳回。
