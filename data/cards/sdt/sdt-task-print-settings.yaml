card_id: sdt-task-print-settings
type: task
title: 面单打印怎么设置？支持哪些纸张规格和打印机？
one_liner: 业务配置 → 面单打印设置选纸张/规格/出单顺序；打印机设置需装 c-lodop 控件再选打印机。
body: |
  【面单打印设置】
  入口：业务配置 → 面单打印设置
  · 可自定义纸张类型、面单规格、出单顺序
  · 支持的面单规格：
    76×130mm、100×150mm、100×210mm、76×165mm
  · 自定义区个性化打印：要联系顺店通项目组申请配置，
    把申请到的代码填进设置页红色框内保存

  【打印机设置】
  入口：业务配置 → 打印机设置
  · 此功能需先安装打印控件 **c-lodop**
  · 用左右箭头把要用的打印机固定到中间位置

  【支持哪些打印方式】
  · 共享打印机、本地打印机
  · C-lodop 插件打印
  · Web 打印（不用装插件）
  · 小程序：蓝牙打印机（芝柯 CC3）
  · 云打印：要联系项目组开通，目前顺店通已全面使用云打印

  【批量导入后打乱顺序】想按导入顺序打印，
  去运单管理 → 运单列表 → 日志 → 点 M 开头的批次号，筛选后打印。
