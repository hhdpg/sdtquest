card_id: sdt-api-sub-order-apply
type: rule
title: 子单号怎么申请？为什么申请子单总被拒？
one_liner: 母单要先配好顾客编码、箱号规则要对齐、一次最多 20 件。
body: |
  【申请子单的前置条件，一条不过就拒】

  **1. 组织必须配好顾客编码和校验码**
  和普通下单一样。没配报「顾客编码,效验码没有配置」。

  **2. 箱号规则必须和母单对齐（最容易错）**
  · 母单**有**箱号 → 子单**必须**传箱号
  · 母单**没有**箱号 → 子单**不允许**传箱号

  这条是双向的，两个方向搞反都会拒。

  **3. 箱号本身的约束**
  · 数量必须等于你要新增的件数
  · 单个箱号长度 1–50
  · 总量不超过 1000
  · 不能是系统里已被使用的箱号（受全局唯一性窗口限制）

  **4. 新增件数一次 1–20 件**
  超过 20 件要分多次申请。

  **5. 客户订单号必填，最长 64 字符**

  【申请成功后会发生什么】
  · 母单的件数**累加**（不是覆盖）
  · 母单的运单号列表**累加**子单号
  · 生成子单记录和箱号映射
  · 如果开通了智慧快递助手，会推送一次

  【常见报错怎么读】
  报「子单号申请失败」时，后面的描述是从顺丰原样透传的：
  · 8018 → 订单不存在（母单号传错了，或者母单还没下成功）
  · 8028 → 未配置业务（顺丰侧这个客户没开通子单能力）
  · 「箱号已被使用」→ 换个新箱号，或用唯一性窗口外的旧号

  【一个时序提醒】
  必须等母单下单成功（有运单号）之后才能申请子单。
  母单还在「已导入」状态时申请，会报订单不存在。
