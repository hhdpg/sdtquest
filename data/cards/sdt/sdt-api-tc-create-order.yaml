card_id: sdt-api-tc-create-order
type: rule
title: 同城创建订单要注意什么？会不会重复下单？
one_liner: 完全不幂等，重试一定下重单；金额单位是分，且先落库再调同城。
body: |
  【最重要的一条：完全不幂等】
  代码里没有任何按商家订单号查重的逻辑。
  网络超时重试、消息重投、手动补调，**都会产生新订单**。

  强烈建议你方在调用侧自己做去重：
  用业务主键 + 调用状态表，保证同一笔业务只调一次。

  如果没传商家订单号，系统会自动用内部订单号填充，
  但这不影响幂等 —— 依旧是每调一次下一条。

  【金额单位是分】
  返回的订单总额、实付、应付等字段**全部是分**。
  展示给用户前要自己除以 100。

  【先落库再调同城】
  顺序是：生成订单号 → 先插本地订单表 → 再调同城开放平台。
  所以同城失败时会留下一张本地单，状态不完整，需要人工处理。

  这和普通下单的「先落库」是同一个设计取舍。

  【下单前会校验店铺配置】
  · 传了寄件组织编码 → 按「同城店铺 + 寄件组织」精确匹配配置，不匹配直接拒
  · 不传 → 只按店铺查；命中多条时组织编码留空继续

  所以「同城店铺 ID 与寄件组织编码不匹配」这个报错，
  是通城服务那边没给这个组合配过。

  【失败】
  同城返回非成功码时，报「下单失败」并带上游原始描述。
  异常和空响应也是同一个报错，所以具体的根因要看去重的描述。

  【必填的关键信息】
  · 店铺的地址和经纬度
  · 收件的地址、经纬度和电话
  · 订单金额
  · 付款方式

  经纬度缺失或偏差太大会导致派单异常，一定要传准确的。
