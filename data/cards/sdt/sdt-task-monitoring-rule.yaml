card_id: sdt-task-monitoring-rule
type: task
title: 智能监控的预警规则怎么设？即将超时和已超时有什么区别？
one_liner: 智能监控 → 监控规则 → 新增规则，选监控节点和预警类型；即将超时提前提醒，已超时是过了承诺时效。
body: |
  【这是什么】
  智能监控（物流雷达）按你设的规则，自动盯运单在途节点，
  到点自动预警或判异常，不用人工盯着查。

  【配置入口】智能监控 → 监控规则 → 新增规则

  【怎么设】
  1. 点【新增规则】，进入「新增监控规则方案」页
  2. 选监控节点：下单、出库、揽件、运输、派送、签收等
  3. 设规则类型：预警类 / 异常类
  4. 设两个阈值：
     · **即将超时预警**：按承诺时效提前设，如承诺 2 小时，预警设 1 小时
     · **已超时预警**：超过物流公司承诺时效后触发
  5. 填好点【确定】

  【启停与修改】
  · 未生效的规则可以【编辑】
  · 点【启动】重设生效日期，点【中止】重设失效日期
  · **已生效的规则不能编辑**

  【预警怎么分发】
  在「包裹监控看板」看预警/异常，
  可按权限规则分发给不同部门/组织的人处理。

  【提示】要监控得准，前提是先把要监控的运单纳入进来
  （本系统下单的，或用月结卡号拉取的）。
