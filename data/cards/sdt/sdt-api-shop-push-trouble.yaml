card_id: sdt-api-shop-push-trouble
type: trouble
title: 店铺 ID 和经纬度推送为什么没收到？为什么没有删除推送？
one_liner: 查白名单、接收地址、服务开通、数据是否齐全；系统本来就没有删除动作。
body: |
  【第一件事：白名单（最常见原因）】
  推送只对白名单里的一级组织生效。不在白名单就一条都不推，也不报错。
  所以「维护了店铺但没收到」，第一步确认一级组织加进白名单没有。

  【第二件事：接收地址】
  消费端要按一级组织 ID 找到你的接收地址，没配就不推。

  【第三件事：同城服务开通状态】
  只有**已覆盖且已开通**同城急送服务的店铺才推。
  数据维护了但服务没开通，要等开通后才补推首次。

  【第四件事：数据是否齐全】
  推送要求店铺 ID 和经纬度**同时有值**。
  只维护了店铺 ID、或只维护了经纬度，都不推，这叫「半量数据不推」。

  【什么时候触发】
  批量导入店铺 ID（新建行、更新行）、编辑店铺 ID、设置经纬度、批量开通、开通所有已覆盖。
  维护动作成功后**实时异步推**，推送失败不影响维护本身。

  【为什么没有删除推送】
  设计如此：页面上没有「删除店铺 ID」或「删除经纬度」的操作，
  系统里也就没有删除动作，只有新增和更新两种。
  配置行被停用回调删除时，也不推、不记日志。

  【报文长什么样】
  一条推送就是一个店铺，不是数组。字段：应用 ID、请求 ID、时间戳、签名、
  动作、组织编码、店铺 ID、经度、纬度。经纬度是 WGS84，空值省略。
