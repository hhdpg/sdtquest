card_id: sdt-task-wecom-auth
type: task
title: 企业微信授权怎么配？为什么企微里看不到顺店通？
one_liner: 业务配置 → 企业微信授权，设成员权限、地址、可见范围，再建自建应用；两处可见范围必须一致。
body: |
  【为什么要授权】
  授权后员工在企微工作台直接打开顺店通小程序，免登录下单。

  【前置】
  1. 用**一级组织管理员账号**登录，地址要用
     https://united-store-ms.sf-express.com/#/login
     （用别的地址登录会授权失败）
  2. 先到 系统管理 → 角色管理 建一个授权专用角色

  【授权步骤】
  1. 业务配置 → 企业微信授权 → 【已注册企业微信，去授权】→【继续授权】
  2. 设置成员权限：选刚才建的角色
  3. 完善部门地址：管理员统一维护 / 员工自主维护（默认管理员维护）
  4. 选可见范围方式：按组织架构 / 按标签，建议按组织架构
  5. 用企微管理员扫码进企微后台，创建「顺店通助手」自建应用
  6. 应用上线后设置应用可见范围并授权

  【最容易踩的坑】
  · **「顺店通助手」可见范围 和 顺店通可见范围必须一样**，
    否则无法正常下单
  · 不在可见范围内的组织和用户，用不了顺店通
  · 「顺店通助手」显示「开发中」时，要找顺丰人员把应用开发上线

  【说明】企微侧有腾讯采购成本（约 5 元/年/用户），
  具体以商务为准。
