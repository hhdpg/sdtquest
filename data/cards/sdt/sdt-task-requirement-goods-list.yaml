title: 要货单怎么建？为什么同步到WMS后运单号会自动回传？
one_liner: 订单中心 → 要货单列表新建，选收货信息/发货仓库/商品，同步WMS后打包发货，运单号自动回传。
body: |
  【入口】订单中心 → 要货单列表

  【要货单是干什么的】
  门店向仓要货的单据。它和普通运单是**两条链路**：
  要货单会**自动同步到 WMS**，WMS 按要货单打包、发货，
  发货运单号再**自动回传**到这张要货单上，完成发货闭环。

  【新增要货单】
  选【收货信息】→ 选【发货仓库】→ 选【要货商品】

  【三个字段怎么选】
  · **收货信息**：即收件人信息，系统**取自组织里维护的收件人信息**
  · **发货仓库**：下拉**只能选到打了【仓库】标签的组织**
  · **商品**：只能是商品管理中维护过的商品

  【手动同步】
  如果没自动同步，点【手动同步】把要货单推给 WMS 发货。

  【查询/导出】
  支持按这些条件筛：要货单号、出库单号、运单号、
  创建/同步/发货/完成时间、要货部门、发货仓库、
  商品名称、商品编码、单据状态。

  【和「上门店调货」的关系】
  小程序端「门店调拨」也是新增要货单，两条入口产出的都是要货单。

  【说明】仓库标签怎么加、WMS 没对接好会怎样，
  见「WMS对接设置」卡。
