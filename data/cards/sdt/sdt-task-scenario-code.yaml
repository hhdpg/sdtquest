card_id: sdt-task-scenario-code
type: task
title: 场景码怎么用？一店一码/逆向二维码怎么配置？
one_liner: 业务配置 → 场景码管理新增，配下单页和收寄信息后生成码；店员/顾客扫码下单，支持预分配单号。
body: |
  【场景码是干什么的】
  给门店/顾客一个二维码，扫码就能按你配好的规则下单。
  常见两种：
  · **正向门店码**：店员/顾客扫码寄件
  · **逆向二维码**：客户往来方扫码回寄（退货/样品回寄）

  【配置入口】业务配置 → 场景码管理 → 新增

  【配置要点】
  · 下单页面由客户自定义（字段、logo、访问权限、有效期）
  · 固定/可选收寄信息：可固定收件地址，减少填错
  · 成本类型可预置，便于对账
  · 支持预分配码（事先维护单号，形成带运单号的码）
  · 可下载、复制、导出、批量打印

  【使用流程】
  新增 → 设置 → 下载二维码 → 打印贴出/嵌入公众号 →
  店员或顾客扫码下单 → 微信扫码下单后可在码上查快递

  【逆向二维码的支付限制】
  仅支持**寄付现结 / 到付**，保障客户月结安全；
  客户可用月结付款码完成月结支付。客户往来方扫码无需开通账号。

  【注意】一店一码/一组织一码都按组织维度隔离，
  哪个组织用哪个码，配置时关联对组织。
