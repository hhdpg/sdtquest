card_id: sdt-api-idempotent-scope
type: rule
title: 重复调下单接口会不会下重单？有没有幂等？
one_liner: 只有白名单客户按客户订单号幂等，其他客户重复提交一定下重单。
body: |
  【结论：按客户区分，不是全局行为】

  **标准下单 / 店配下单**
  只有当你的组织在「幂等白名单」里、且传了客户订单号时才有幂等：
  · 幂等键 = 客户订单号 + 寄件组织
  · 命中后复用历史订单号，但**仍会重新向顺丰下单一次**，
    结果回写原单 —— 所以这也不是严格的幂等，
    更准确说是「复用订单号」。
  · 不在白名单的客户：**重复提交就是重复下单**，没有任何拦截。

  **同城下单**（创建同城订单）
  **完全不幂等**。代码里没有任何按商家订单号查重的逻辑。
  客户重试、网络超时重试、消息重投，都会产生新订单。
  强烈建议你方在调用侧自己做去重。

  **O2O 电子面单取号**
  这个是幂等的，但机制不同：
  先向外部取号拿到运单号，再按「运单号 + 应用 ID」查重。
  重复的会返回「重复下单，运单号已存在」。
  并发时 30 秒内返回「取号中，请稍后」。

  【顺带一个重复单校验】
  还有一个「重复下单检查」开关，
  打开后近 180 天内同客户订单号会直接被拒（报「订单号重复，不允许下单」）。
  这是拒绝，不是幂等 —— 不会返回原单。

  【给客户的建议】
  不管在不在白名单，**调用侧都应该自己做幂等**：
  用业务主键 + 状态表，保证同一业务单只调一次。
  不要依赖服务端兜底。
