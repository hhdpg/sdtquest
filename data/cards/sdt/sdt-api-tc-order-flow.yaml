card_id: sdt-api-tc-order-flow
type: rule
title: 同城状态流查询和订单实时信息查询有什么区别？
one_liner: 状态流查过程节点，实时信息查最终状态和费用明细，后者只支持 60 天内。
body: |
  【状态流查询：查过程节点】
  返回订单经历过的节点列表：操作人、操作人姓名、电话、
  订单状态、状态描述、创建时间、推送时间。
  用来做「物流时间轴」展示，随时可查。

  【订单实时信息查询：查最终状态和费用】
  返回：订单状态和描述、骑士姓名和电话、
  订单总额、实付、实收、优惠券金额、超重费、免配送费、扣减费用、
  结算方式、配送距离、重量、开始时间、预计送达、取货码、完成码。
  用来做「订单完结后的对账」。

  **只支持 60 天内**的订单，超了上游直接报错，所以对账要在这个窗口内跑完。

  【金额单位是分】
  实时信息里所有金额字段都是分，展示要除以 100。

  【实时信息的一个参数规则】
  按商家订单号查询（订单类型 = 2）时**必须同时传店铺 ID**，
  不传会报「商家订单号查询时店铺 ID 不能为空」。

  【异常处理不同】
  · 状态流：上游异常统一包成「操作失败」，不区分查不到和系统错
  · 实时信息：上游业务失败会透传原始描述（订单不存在、超 60 天）

  排查实时信息时看报错描述更有用。

  【版本提醒】
  实时信息查询是后加的，如果生产环境还没上，调用会 404。接入前先确认版本。
