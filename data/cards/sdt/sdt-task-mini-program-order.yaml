card_id: sdt-task-mini-program-order
type: task
title: 小程序寄快递怎么下单？和PC端下单有什么不同？
one_liner: 小程序支持标准/异地代发/调拨/客户退货四种下单，入口在权限配置里开，寄件类型只有快递包裹和同城急送。
body: |
  【入口】小程序 → 寄快递

  【支持哪些下单类型】
  支持 4 种：标准下单、异地代发、调拨下单、客户退货。
  具体显示哪几个，由 PC 后台 **角色管理 → 权限配置 → 新建订单** 决定。
  没配的类型，小程序里看不到。

  【寄件类型】
  · 快递包裹（默认）
  · 同城急送 —— **只有开通了同城急送服务才显示**
  没开通的话，页面上不出现【同城急送】选项。

  【下单步骤】
  依次填：成本类型 → 寄件人信息 → 收件人信息 → 业务相关信息
  点【确认下单】完成。

  【和 PC 端的主要区别】
  · **寄件类型少**：小程序只快递包裹/同城急送，没有跨境等
  · **标准下单的寄件信息**：取组织里维护的信息，
    要改得去【系统管理 → 组织管理】
  · **客户退货**：收件信息同样是组织维护的信息

  【港澳台寄递】
  寄件地址选区域 → 物品明细选【币种】→ 填报关物品信息。

  【H5 版本更少】
  H5 只支持快递包裹一种寄件类型，且部分配置显示但无效
  （定时派送、签单返还拍照回传、港澳台件、锁定收寄件信息、
  物流公司选择、同城急送、到付挂月结都不适用）。

  【说明】权限配置具体怎么勾，见「角色权限」卡。
