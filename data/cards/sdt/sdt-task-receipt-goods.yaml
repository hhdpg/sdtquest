title: 收单商品怎么新建和上下架？为什么顾客在小程序里看不到商品？
one_liner: 收单中心 → 收单商品管理，点新建商品填信息；商品下架或未上架，顾客在小程序就看不到。
body: |
  【入口】收单中心 → 收单商品管理

  【干什么的】
  维护「能被收单码/小程序卖的商品」。
  顾客扫收单码下单时，选的就是这里的商品。

  【怎么新建和上下架】
  · 新建：点【新建商品】，填商品信息后保存
  · 编辑：点【编辑】改已有商品信息
  · 上下架：商品可上架/下架，下架后顾客在小程序看不到、选不了

  【说明】手册只写了【新建商品】【编辑】两个按钮的名称，
  上下架的具体操作方式以页面实际显示为准，我不能替你查。

  【上下架】
  商品可上架/下架。
  **下架的商品，顾客在小程序里看不到、选不了**。
  这是「顾客说找不到商品」最常见的原因。

  【和商品中心的关系】
  · **商品中心**：维护商品主数据（SKU、分类、品牌、单位）
  · **收单商品管理**：决定哪些商品能用于收单售卖
  商品主数据在商品中心维护，收单这里管的是售卖侧。

  【说明】具体商品怎么定价、怎么规划分类属于业务配置，
  以实际页面为准，我不能替你查。
