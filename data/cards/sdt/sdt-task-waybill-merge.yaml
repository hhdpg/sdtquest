title: 合单发货怎么用？合并生单规则配置和自动合单有什么区别？
one_liner: 合单发货需单独开通；先配合并生单规则，再导入订单合并，合并后进批量下单池出运单。
body: |
  【要单独开通】
  合单发货**默认不开通**，需要单独申请开通。
  已支持对接 **OTMS**，可从 OTMS 自动取数合单。

  【合单发货怎么用（手工合并）】
  1. 先配规则：进【合并生单规则配置】按需设规则
     ——**只有一级组织管理员能配**
  2. 点【导入订单】，先下载导入模板，填好再导入
  3. 点【合并订单】执行合并
  4. 合并后进入【运单管理 → 批量下单】池，
     下单后流入运单列表，再做打印、取消
  5. 若开通了智慧快递助手打单/贴单，运单数据会自动流入

  【自动合单规则怎么配（接口对接）】
  在【自动合单规则配置】里配，同样**只有一级组织管理员能配**。
  配好后系统按 **APPID** 自动匹配规则，
  自动合并订单并追加子单，不用再手工导 Excel。

  【两者区别】
  · 手工合并：自己导 Excel，手动点合并
  · 自动合单：客户系统按 APPID 对接，系统自动合并和追加子单

  【说明】具体合单规则字段（怎么判断能合）以配置页为准，
  我不能替你查。
