card_id: sdt-rule-freight-budget
type: rule
title: 运费预算怎么配？超预算了会怎样？
one_liner: 业务配置 → 运费预算配置按组织设额度；超额度时按模式处理：需审批、转寄付现结、或直接下不了单。
body: |
  【用途】
  给门店/组织设一个下单运费额度，防止超预算发件。
  适合对门店下单量、运费强管控的客户。

  【入口】业务配置 → 运费预算配置

  【额度怎么算】
  可用额度 = 预算上限 − 已扣减 − 已占用
  · 已占用：已下单但还没最终扣费的
  · 下单时用「可用额度 − 预估运费」判断是否超额
  · 运单取消后，占用的额度会自动退回

  【超额度怎么办（三种模式）】
  1. **需审批**（默认）：超了进审批，审批通过才能发
  2. **转寄付现结**：超了自动改寄付现结，不占预算
  3. **无法下单**：超了直接不让下

  【每月自动更新】
  系统在**每月最后一天的晚上**自动刷新额度：
  基于本月预算生成下月预算，占用和扣减清零，下月 1 号生效。
  所以每月额度会自动恢复，不需要手工重置。

  【入口还有】新增/批量新增额度、启用/关闭、批量更新、导出。

  【说明】你们组织配了多少额度、用哪种超额模式，
  以运费预算配置页面的实际显示为准，我不能替你查。
