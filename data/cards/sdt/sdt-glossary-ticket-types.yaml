card_id: sdt-glossary-ticket-types
type: glossary
title: 工单有哪些类型？哪些是自动处理、哪些要人工？
one_liner: 自动类：转寄、退回、优派、再派、改自取、改派送、改派送时间、改收件人、改付款方式等直接下发大网。
body: |
  【工单类型一览】
  · 运单调整类（多数自动下发大网）：
    转寄、退回、优先派送、再次派送、改派（其他自取点取件）、
    改派送（上门派送）、更改派送时间、修改收件人信息、
    更改付款方式、修改代收货款、作废、
    退回寄件网点、退回到寄件地址
  · 异常处理类（人工跟进）：
    破损、遗失（理赔）等

  【自动 vs 人工】
  · **自动类**：系统自动下发顺丰大网执行指令，
    下发成功状态自动更新，无需人工；
    下发失败才转人工
  · **人工类**：查签收、查破损、理赔等，
    由客服「处理中」跟进，「已处理」关闭

  【工单状态】
  待处理 → 处理中 → 已处理（关闭）；未通过审批的会退回创建人。

  【工单来源】
  手工创建、API 调用、监控预警自动生成、小程序提交。

  【同类型工单不能重复建】
  提交时会做同类型校验，已有同类型未完结工单会提示。

  【说明】具体每类工单的必填项不同，以建单页面带星提示为准。
