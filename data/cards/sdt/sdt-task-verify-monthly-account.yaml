title: 月结卡号怎么验证？为什么提示月结账号未校验？
one_liner: 业务配置 → 顺丰月结设置 → 月结账号管理 → 验证月结账号，输卡号并用手机或邮箱收验证码。
body: |
  【为什么要验证】
  应信息安全要求，客户月结卡号**用之前必须先验证**。
  接口对接的客户也一样，没验证过月结就下不了运单。

  【验证入口】
  业务配置 → 顺丰月结设置 → 月结账号管理

  【验证步骤】
  1. 点【验证月结账号】
  2. 弹窗里输入月结账号，点【提交】
  3. 选择用手机或邮箱接收验证码，点【获取验证码】
  4. 填入收到的验证码，点【确认并提交】完成验证

  【查已验证的月结】
  可按月结账号、验证时间来查询。
  不再使用的月结，点后面的【删除】删除。

  【常见提示「组织模板导入提示月结账号未校验」】
  → 就是该月结还没在上面这步验证过，先去验证完再导入。

  【说明】一个组织能配几个月结、绑定给谁，取决于挂账规则，
  具体以你们组织的实际配置为准，我不能替你查。
