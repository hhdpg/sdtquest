# 检索评分配置
#
# 本文件承载"九条防误召回规则"所需的全部业务配置。
# 新业务接入时只需在此追加域名和词表，无需改代码。
#
# 用法：
#   src/rag/card_scoring.py 读取本文件，供正式检索器和评估脚本共用。
#
# 维护约定：
#   · domains 的词要选「该业务独有」的词，不要把"系统""管理"这类通用词放进去
#   · intents 的 markers 是「用户提问时会用的词」，card_types 是「应该优先命中的卡型」
#   · generic_tokens 是跨业务通用的无区分度词，全局共享

version: 1

# ── 阈值 ──────────────────────────────────────────────
# 卡片数量变化后必须重新标定：分数随卡片总数上浮
thresholds:
  # 关键词评分命中阈值（与向量相似度阈值是两套量纲）
  # 2026-11-25 重标定：卡片 90 → 137（新增开放接口域），
  # 实测本域命中卡最低分 8.04，取 5.0 保证 142/142 全召回并略收紧。
  keyword_score: 5.0
  # 卡片总数低于此值时，按小库处理（阈值可下调）
  small_corpus_size: 50

# ── 中文分词 ──────────────────────────────────────────
tokenizer:
  # 中文 n-gram 窗口大小（长词更具体，优先保留）
  ngram_sizes: [2, 3, 4]
  # 停用词：疑问/虚词，无检索价值
  stopwords:
    - 怎么
    - 如何
    - 什么
    - 哪些
    - 哪里
    - 为什么
    - 能不能
    - 可以
    - 请问
    - 一下
    - 操作
    - 使用
    - 需要
    - 应该
    - 我要
    - 我想
    - 帮我
    - 的
    - 了
    - 吗
    - 呢
    - 是
    - 有
    - 在
    - 和
    - 或

# ── 规则1：泛化词不给分 ───────────────────────────────
# 这些词出现在多数卡片里，单独命中不具区分度
# ⚠️ 不要放真正的领域词（如"同城急送""审批"），它们是区分卡片的关键信号
generic_tokens:
  - 下单
  - 订单
  - 创建
  - 系统
  - 管理
  - 配置
  - 导入
  - 导出
  - 查询
  - 页面
  - 功能
  - 选项
  - 操作
  - 使用
  - 可以
  - 怎么
  - 什么
  - 如何
  - 哪些
  - 需要
  - 支持
  - 批量
  - 新增
  - 设置
  - 活动
  - 服务器
  - 服务
  - 员工
  - 流程
  - 申请

# ── 规则2：排障意图标记 ───────────────────────────────
# 问题中出现这些词，说明用户在问"为什么不行"
troubleshoot_markers:
  - 提示
  - 报错
  - 错误
  - 失败
  - 不可用
  - 不了
  - 无法
  - 缺少
  - 没收到
  - 没有权限
  - 怎么办
  - 登不上
  - 不匹配
  - 注销
  - 冻结
  - 是空的
  - 没有显示
  - 不显示
  - 选不到
  - 找不到
  - 没有选项
  - 没有数据
  - 下拉没
  - 系统异常
  - 转换失败
  - 入参
  - 不符合
  - 无权访问
  - 未查到
  - 重复运单

# ── 规则8：动作意图 → 优先卡型 ─────────────────────────
# 通用意图跨业务复用；业务专属意图在各业务的 intents 下追加
intents:
  开通:
    markers: [开通]
    card_types: [flow]
  配置:
    # "在哪配置"既可能是 rule（规则怎么定）也可能是 task（动手操作）
    markers: [配置, 设置, 怎么弄, 怎么弄好, 怎么配, 怎样配, 在哪配置, 哪里配]
    card_types: [rule, task, flow]
  完成判断:
    markers: [判断, 配好, 配好了, 配置完成, 怎么算, 是否]
    card_types: [rule]
  区别:
    markers: [区别, 含义, 什么意思, 分别, 定义, 是什么意思, 怎么选, 该用哪个, 有哪些不同]
    card_types: [glossary]
  限制:
    markers: [限制, 最多, 几个, 上限, 数量, 可以吗, 能吗]
    card_types: [rule, glossary, task]
  审批:
    markers: [审批, 审核, 驳回]
    card_types: [rule, flow]
  新增:
    markers: [新增, 添加, 创建, 建]
    card_types: [task]
  下单操作:
    # 只用"要动手下单"的动词短语，不能用裸「下单」——
    # 「下单类型怎么选」会被误判成操作意图，把概念卡降权掉。
    markers: [下单操作, 如何下单, 怎么下单, 下单流程, 寄件, 提交订单]
    card_types: [task]
  # 👇 2026-11-24 补卡新增意图
  验证:
    markers: [验证, 校验, 未校验, 认证]
    card_types: [task, rule]
  对账:
    markers: [对账, 账单, 结算, 核销, 付款]
    card_types: [task, flow]
  监控:
    markers: [监控, 预警, 超时, 异常件]
    card_types: [task, flow, rule]
  工单:
    markers: [工单, 处理工单, 建工单, 提交工单, 工单审批]
    card_types: [flow, task, trouble]
  打印:
    markers: [打印, 面单, 打印机]
    card_types: [task, rule]
  扫码:
    markers: [扫码, 二维码, 场景码, 一店一码]
    card_types: [task, flow]

# ── 规则7：业务域隔离 ──────────────────────────────────
# 问题命中某域关键词 → 其他域的卡片大幅降权
# 新业务接入：在此追加域名和它的专属词
domains:
  订单:
    keywords: [下单, 订单, 运单, 寄件, 收件, POD, 签收, 发货, 快递, 包裹]
  报表:
    keywords: [报表, 统计, 数据看板, 字段, 导出Excel]
  库存:
    keywords: [库存, 仓库, 盘点, 缺货, 要货, WMS, 库存查询]
  测评:
    keywords: [测评, 问卷, 作答, 回收, 催办]
  同城:
    keywords: [同城急送, 同城, 急送, 门店调拨]
  账号:
    keywords: [账号, 密码, 登录, 角色, 权限]
  组织:
    keywords: [组织, 子组织, 一级组织]
  # 👇 2026-11-24 补卡新增
  月结:
    keywords: [月结, 月结卡号, 月结账号, 挂账, 到付月结, 月结验证]
  打印:
    keywords: [面单, 打印, 打印机, 纸张, c-lodop, 蓝牙打印机, 打印顺序]
  监控:
    keywords: [智能监控, 预警, 监控规则, 即将超时, 物流雷达, 月结卡号维护]
  工单:
    keywords: [工单, 拦截, 转寄, 退回, 理赔, 破损, 遗失, 异常件处理]
  财务:
    keywords: [对账, 账单, 结算, 开票, 月结协议, 物流成本]
  场景码:
    keywords: [场景码, 二维码, 一店一码, 扫码下单, 逆向下单, 预分配码]
  企业微信:
    keywords: [企业微信, 企微, 顺店通助手, 自建应用, 可见范围]
  商户开通:
    keywords: [商户, 开通商户, 数字商店, 运营平台, 来源单号, 订阅]
  版本:
    keywords: [版本, 套餐, 标准版, 专业版, 高级版, 旗舰版, 定价]
  # 👇 2026-11-24 供应链补卡新增
  供应链:
    keywords: [收单, 要货, 补货, 店铺, 电子面单, 商品, 地址簿, 到齐派, 需求单]
  预算:
    keywords: [预算, 运费预算, 额度, 超预算, 预算上限]
  # 👇 2026-11-25 开放接口域（客户技术对接）
  # 词要选「对接场景才出现的」：业务人员问「下单」不会命中这里，
  # 技术对接人问「签名怎么算」不会命中订单域，两边互不干扰。
  开放接口:
    keywords: [接口, 对接, 开放平台, 签名, appId, appSecret, 联调, 回调, 推送地址, 请求参数, 接口报错, 对接文档, token]

# ── 规则10：专属域 ─────────────────────────────────────
# 这些业务的卡片正文必然夹带通用业务词（接口卡会写「订单」「取消」「运费」），
# 会被规则7 判成「订单」域而抢走业务问题的首位。
# 列在这里的域：问题没命中该域关键词时，该域的卡片额外降权。
# 注意：只放「服务特定人群」的域，业务域不要放进来。
exclusive_domains:
  - 开放接口
# 该域卡片的 module 字段值；命中这里的卡片在「问题不属于专属域」时降权。
exclusive_modules:
  - 顺店通开放接口

# ── 规则9：反向动作对 ─────────────────────────────────
# 问"导出"时不应命中讲"导入"的卡
opposite_actions:
  - [导入, 导出]
  - [新增, 删除]
  - [启用, 禁用]
  - [发送, 回收]

# ── 评分权重 ──────────────────────────────────────────
weights:
  # 各字段命中时的权重（同一 token 跨字段只取最高值，见规则4）
  one_liner: 3.0
  title: 2.5
  anchors: 2.0
  body: 0.3
  # 规则5：标题命中额外加权（按覆盖率，最高 +60%）
  title_coverage_boost: 0.6
  # 意图命中/未命中的乘性调整
  intent_match: 1.5
  intent_miss: 0.75
  # 规则8：卡型意图不一致的降权
  trouble_without_marker: 0.25
  task_flow_with_marker: 0.6
  # 规则7：域冲突降权
  domain_conflict: 0.15
  domain_unknown: 0.7
  # 规则10：专属域未命中时对专属域卡片的降权（0.55 实测：
  # 业务问题回到业务卡首位，同时接口问题 142/142 仍全召回）
  exclusive_domain_miss: 0.55
  # 规则9：反向动作降权
  opposite_action: 0.2
  # 泛化词兜底模式降权（问题全由泛化词构成时）
  degraded: 0.5
