# 检索评分配置
#
# 本文件承载"九条防误召回规则"所需的全部业务配置。
# 新业务接入时只需在此追加域名和词表，无需改代码。
#
# 用法：
#   src/rag/card_scoring.py 读取本文件，供正式检索器和评估脚本共用。
#
# 维护约定：
#   · domains 的词要选「该业务独有」的词，不要把"系统""管理"这类通用词放进去
#   · intents 的 markers 是「用户提问时会用的词」，card_types 是「应该优先命中的卡型」
#   · generic_tokens 是跨业务通用的无区分度词，全局共享

version: 1

# ── 阈值 ──────────────────────────────────────────────
# 卡片数量变化后必须重新标定：分数随卡片总数上浮
thresholds:
  # 关键词评分命中阈值（与向量相似度阈值是两套量纲）
  keyword_score: 3.0
  # 卡片总数低于此值时，按小库处理（阈值可下调）
  small_corpus_size: 50

# ── 中文分词 ──────────────────────────────────────────
tokenizer:
  # 中文 n-gram 窗口大小（长词更具体，优先保留）
  ngram_sizes: [2, 3, 4]
  # 停用词：疑问/虚词，无检索价值
  stopwords:
    - 怎么
    - 如何
    - 什么
    - 哪些
    - 哪里
    - 为什么
    - 能不能
    - 可以
    - 请问
    - 一下
    - 操作
    - 使用
    - 需要
    - 应该
    - 我要
    - 我想
    - 帮我
    - 的
    - 了
    - 吗
    - 呢
    - 是
    - 有
    - 在
    - 和
    - 或

# ── 规则1：泛化词不给分 ───────────────────────────────
# 这些词出现在多数卡片里，单独命中不具区分度
# ⚠️ 不要放真正的领域词（如"同城急送""审批"），它们是区分卡片的关键信号
generic_tokens:
  - 下单
  - 订单
  - 创建
  - 系统
  - 管理
  - 配置
  - 导入
  - 导出
  - 查询
  - 页面
  - 功能
  - 选项
  - 操作
  - 使用
  - 可以
  - 怎么
  - 什么
  - 如何
  - 哪些
  - 需要
  - 支持
  - 批量
  - 新增
  - 设置

# ── 规则2：排障意图标记 ───────────────────────────────
# 问题中出现这些词，说明用户在问"为什么不行"
troubleshoot_markers:
  - 提示
  - 报错
  - 错误
  - 失败
  - 不可用
  - 不了
  - 无法
  - 缺少
  - 没有权限
  - 怎么办
  - 登不上
  - 不匹配
  - 注销
  - 冻结
  - 是空的
  - 没有显示
  - 不显示
  - 选不到
  - 找不到
  - 没有选项
  - 没有数据
  - 下拉没

# ── 规则8：动作意图 → 优先卡型 ─────────────────────────
# 通用意图跨业务复用；业务专属意图在各业务的 intents 下追加
intents:
  开通:
    markers: [开通, 申请, 部署]
    card_types: [flow]
  配置:
    # "在哪配置"既可能是 rule（规则怎么定）也可能是 task（动手操作）
    markers: [配置, 设置, 部署, 怎么弄, 怎么弄好, 怎么配, 怎样配, 在哪配置, 哪里配]
    card_types: [rule, task, flow]
  完成判断:
    markers: [判断, 配好, 配好了, 配置完成, 怎么算, 是否]
    card_types: [rule]
  区别:
    markers: [区别, 含义, 什么意思, 分别, 定义, 是什么意思]
    card_types: [glossary]
  限制:
    markers: [限制, 最多, 几个, 上限, 数量, 可以吗, 能吗]
    card_types: [rule, glossary]
  审批:
    markers: [审批, 审核, 驳回]
    card_types: [rule, flow]
  新增:
    markers: [新增, 添加, 创建, 建]
    card_types: [task]
  下单操作:
    markers: [下单, 寄件, 提交]
    card_types: [task]

# ── 规则7：业务域隔离 ──────────────────────────────────
# 问题命中某域关键词 → 其他域的卡片大幅降权
# 新业务接入：在此追加域名和它的专属词
domains:
  订单:
    keywords: [下单, 订单, 运单, 寄件, 收件, POD, 签收, 发货, 快递, 包裹]
  报表:
    keywords: [报表, 统计, 数据看板, 字段, 导出Excel]
  库存:
    keywords: [库存, 仓库, 盘点, 缺货, 要货]
  测评:
    keywords: [测评, 问卷, 作答, 回收, 催办]
  同城:
    keywords: [同城急送, 同城, 急送, 门店调拨]
  账号:
    keywords: [账号, 密码, 登录, 角色, 权限]
  组织:
    keywords: [组织, 子组织, 一级组织]

# ── 规则9：反向动作对 ─────────────────────────────────
# 问"导出"时不应命中讲"导入"的卡
opposite_actions:
  - [导入, 导出]
  - [新增, 删除]
  - [启用, 禁用]
  - [发送, 回收]

# ── 评分权重 ──────────────────────────────────────────
weights:
  # 各字段命中时的权重（同一 token 跨字段只取最高值，见规则4）
  one_liner: 3.0
  title: 2.5
  anchors: 2.0
  body: 0.3
  # 规则5：标题命中额外加权（按覆盖率，最高 +60%）
  title_coverage_boost: 0.6
  # 意图命中/未命中的乘性调整
  intent_match: 1.5
  intent_miss: 0.75
  # 规则8：卡型意图不一致的降权
  trouble_without_marker: 0.25
  task_flow_with_marker: 0.6
  # 规则7：域冲突降权
  domain_conflict: 0.15
  domain_unknown: 0.7
  # 规则9：反向动作降权
  opposite_action: 0.2
  # 泛化词兜底模式降权（问题全由泛化词构成时）
  degraded: 0.5
