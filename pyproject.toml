[project]
name = "dingtalk-qa-bot"
version = "0.1.0"
description = "钉钉智能问答机器人 — 基于本地大模型的 RAG 问答系统"
requires-python = ">=3.11"

dependencies = [
    # Web & 钉钉
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "dingtalk-stream>=0.15",

    # RAG & 向量
    "chromadb>=0.5",
    "llama-index>=0.10",

    # LLM
    "httpx>=0.27",             # 异步 HTTP 客户端

    # 代码解析
    "tree-sitter>=0.22",
    "tree-sitter-javascript>=0.21",
    "beautifulsoup4>=4.12",    # HTML 解析

    # 工具
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "apscheduler>=3.10",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
dashboard = [
    "streamlit>=1.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 集成测试（可能依赖外部服务）",
    "slow: 慢速测试",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle 错误
    "F",    # pyflakes（未定义名、未用导入/变量）
    "W",    # pycodestyle 警告
]
# 允许在 __init__.py 中重导出（显式声明 __all__ 时）
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
